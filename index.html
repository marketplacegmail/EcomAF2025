            padding:30px 20px; gap:14px; flex:1;
        }
        #panelMota .mc-prev-lbl {
            font-size:10px; font-weight:600; text-transform:uppercase;
            letter-spacing:1.8px; color:#9ca3af; align-self:center;
        }

        /* ══════════════════════════════════════════
           THE CARD — 5 BLOCKS (Hero, Benefits, Material, Care, CTA)
           Mobile-first: 400px wide. Borderless: whitespace-only separation.
        ══════════════════════════════════════════ */
        #mc-card {
            font-family: &#x27;Barlow&#x27;, sans-serif;
            width: 400px;
            --block-h: 533.34px;        /* 400 × 4/3 — chiều cao chuẩn cho mọi block 3:4 */
            background: var(--m-bg-card);
            color: var(--m-text-primary);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0,0,0,.06);
        }

        /* ─────────── BLOCK 1: HERO — height CỨNG 3:4, không bao giờ tràn ─────────── */
        .mc-b1-hero {
            background: var(--m-bg-card);
            padding: 32px 24px 24px;
            width: 100%;
            height: var(--block-h);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .mc-b1-title {
            font-size: 14px;
            font-family: &#x27;Barlow&#x27;, sans-serif;
            font-weight: 200;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            text-align: center;
            line-height: 1.4;
            color: var(--m-text-primary);
            margin: 0 0 6px;
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
        }

        .mc-b1-quote {
            font-size: 12.5px;
            font-style: italic;
            font-weight: 300;
            color: var(--m-text-quote);
            text-align: center;
            margin: 0 0 16px;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .mc-b1-icons {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .mc-b1-icon-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 9px;
            flex: 1;
        }

        .mc-b1-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
        .mc-b1-icon svg {
            width: 48px; height: 48px;
            stroke: var(--m-text-primary);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .mc-b1-icon-lbl {
            font-size: 11px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--m-text-primary);
            text-align: center;
            line-height: 1.3;
        }

        /* Image: contain thật sự — giữ đúng tỷ lệ gốc, không kéo giãn */
        .mc-b1-image {
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            background: var(--m-bg-image);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .mc-b1-image.has-img { background: #FFFFFF; }
        .mc-b1-image img {
            /* contain: ảnh luôn hiện đầy đủ, giữ nguyên tỷ lệ, không bao giờ bị kéo giãn */
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            transform: scale(var(--img-zoom, 1));
            transform-origin: var(--img-origin, center center);
        }
        .mc-b1-image .ph {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            color: var(--m-text-icon); opacity: .55;
        }
        .mc-b1-image .ph svg { width: 38px; height: 38px; stroke-width: 1.2; }
        .mc-b1-image .ph span {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em;
        }

        /* ─────────── BLOCK 2: BENEFITS — height CỨNG 3:4 ─────────── */
        .mc-b2-benefits {
            background: var(--m-bg-card);
            padding: 36px 30px;
            width: 100%;
            height: var(--block-h);
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .mc-b2-title {
            font-size: 14px;
            font-family: &#x27;Barlow&#x27;, sans-serif;
            font-weight: 300;          /* Light — match b5 */
            text-transform: uppercase;
            text-align: center;
            color: var(--m-text-primary);
            margin: 0 0 36px;
            letter-spacing: 0.15em;
        }
        .mc-b2-title .mc-keep-lower { text-transform: none; }

        .mc-b2-list { display: flex; flex-direction: column; gap: 22px; }

        .mc-b2-item { display: flex; align-items: flex-start; gap: 16px; }

        .mc-b2-plus {
            font-size: 14px;
            font-weight: 300;
            color: var(--m-text-primary);
            flex-shrink: 0;
            margin-top: 5px;
            line-height: 1;
            width: 10px;
        }

        .mc-b2-text {
            font-size: 16px;
            font-weight: 300;          /* Light */
            line-height: 1.7;
            color: var(--m-text-secondary);
            text-align: justify;
            margin: 0;
            flex: 1;
        }

        /* ─────────── COMBINED 3+4 (Material trên + Care fill dưới) — height CỨNG 3:4 ─────────── */
        #mc-combined-3-4 {
            background: var(--m-bg-card);
            width: 100%;
            height: var(--block-h);
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .mc-b3-material {
            background: var(--m-bg-card);
            padding: 36px 32px 28px;
            display: grid;
            grid-template-columns: 70% 30%;
            gap: 16px;
            align-items: flex-start;
            flex-shrink: 0;              /* keep its natural height inside the combined wrapper */
        }

        .mc-b3-col { display: flex; flex-direction: column; gap: 10px; }

        .mc-b3-num {
            font-size: 36px;
            font-weight: 300;          /* Light */
            line-height: 1;
            margin-bottom: 6px;
            font-family: &#x27;Barlow&#x27;, sans-serif;
            letter-spacing: -0.01em;
        }
        .mc-b3-num.main { color: var(--m-text-primary); }
        .mc-b3-num.sub  { color: var(--m-text-icon); }
        .mc-b3-num .pct { font-size: 22px; font-weight: 300; margin-left: 1px; }

        .mc-b3-name {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            line-height: 1.3;
            margin: 0;
        }
        .mc-b3-name.main { color: var(--m-text-primary); }
        .mc-b3-name.sub  { color: var(--m-text-icon); font-weight: 400; letter-spacing: 0.18em; }

        .mc-b3-desc {
            font-size: 12.5px;
            font-weight: 300;
            color: var(--m-text-quote);
            line-height: 1.55;
            margin: 0;
        }
        .mc-b3-desc.sub { color: var(--m-text-icon); font-size: 11px; }

        /* ─────────── BLOCK 4: CARE (flex column, image fills) ─────────── */
        .mc-b4-care {
            background: var(--m-bg-card);
            padding: 26px 32px 0;        /* bottom 0 — image extends to edge */
            flex: 1;                      /* take all remaining height in combined wrapper */
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .mc-b4-title {
            font-size: 13px;
            font-family: &#x27;Barlow&#x27;, sans-serif;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            color: var(--m-text-primary);
            margin: 0 0 18px;
        }

        .mc-b4-image {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: var(--m-bg-card);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .mc-b4-image.has-img { background: #FFFFFF; }
        .mc-b4-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            transform: scale(var(--img-zoom, 1));
            transform-origin: var(--img-origin, center center);
        }
        .mc-b4-image .ph {
            width: 100%;
            height: 100%;
            background: var(--m-bg-image);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            color: var(--m-text-icon); opacity: .55;
        }
        .mc-b4-image .ph svg { width: 32px; height: 32px; stroke-width: 1.2; }
        .mc-b4-image .ph span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; }

        /* ─────────── BLOCK 5: CTA — height CỨNG 3:4 ─────────── */
        .mc-b5-cta {
            background: var(--m-bg-card);
            padding: 36px 28px 0;        /* bottom 0 — image extends to edge */
            width: 100%;
            height: var(--block-h);
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .mc-b5-title {
            font-size: 16px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            line-height: 1.55;
            color: var(--m-text-primary);
            margin: 0 0 22px;
            flex-shrink: 0;
        }

        .mc-b5-image {
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            background: var(--m-bg-image);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .mc-b5-image.has-img { background: #FFFFFF; }
        .mc-b5-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            transform: scale(var(--img-zoom, 1));

        .mc-b5-image .ph {

        .mc-b5-image .ph svg { width: 30px; height: 30px; stroke-width: 1.2; }
        .mc-b5-image .ph span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; }

&lt;style data-injected=&quot;ibasic-mobile-ux&quot;&gt;
/* === iBasic Ecommerce — Global Mobile UX Layer === */
:root { --ibx-tap: 44px; }

* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
img, video, canvas, svg { max-width: 100%; height: auto; }

/* Prevent iOS auto-zoom on focus */
input, select, textarea, button {
    font-size: 16px;
}

@media (max-width: 820px) {
    /* Reduce big margins/padding on common wrappers */
    body { padding: 12px 8px !important; margin: 0 !important; }
    .container, .wrapper, .main, .content, .page,
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl, .max-w-3xl,
    .max-w-2xl, .max-w-xl, .max-w-lg, .max-w-md {
        max-width: 100% !important;
        padding-left: 10px !important;
        padding-right: 10px !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    /* Make wide cards/sections flow */
    .card, .panel, .section, .box, .bg-white,
    .rounded-xl, .rounded-2xl, .rounded-3xl {
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    /* Larger tap targets for buttons */
    button, .btn, [role=&quot;button&quot;], input[type=&quot;button&quot;], input[type=&quot;submit&quot;], input[type=&quot;reset&quot;] {
        min-height: var(--ibx-tap);
        padding-top: 0.6rem;
        padding-bottom: 0.6rem;
    }

    /* Make grids stack */
    .grid, .columns, [class*=&quot;grid-cols-&quot;] {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .grid-cols-2-keep { grid-template-columns: 1fr 1fr !important; }

    /* Flex rows that should wrap */
    .row, .form-row, .field-row, .actions, .toolbar, .button-row,
    .flex-row, .header-row, .actions-row {
        flex-wrap: wrap !important;
        gap: 0.5rem !important;
    }

    /* Inputs full width */
    input[type=&quot;text&quot;], input[type=&quot;number&quot;], input[type=&quot;email&quot;],
    input[type=&quot;search&quot;], input[type=&quot;url&quot;], input[type=&quot;tel&quot;],
    input[type=&quot;date&quot;], input[type=&quot;time&quot;], input[type=&quot;datetime-local&quot;],
    select, textarea {
        width: 100%;
        max-width: 100%;
    }

    /* Tables become horizontally scrollable to prevent layout break */
    table {
        display: block;
        width: 100% !important;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* Headings: smaller on mobile */
    h1 { font-size: 1.5rem !important; line-height: 1.25 !important; }
    h2 { font-size: 1.25rem !important; line-height: 1.3 !important; }
    h3 { font-size: 1.1rem !important; line-height: 1.35 !important; }

    /* Generic modals */
    .modal, .dialog, [class*=&quot;modal-&quot;], [class*=&quot;dialog-&quot;] {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        border-radius: 12px !important;
    }

    /* Tabs: scroll horizontally */
    .tabs, .tab-bar, .nav-tabs, [role=&quot;tablist&quot;] {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        flex-wrap: nowrap !important;
        white-space: nowrap;
    }

    /* Sticky bottom action bar pattern (if present) */
    .sticky-actions, .bottom-bar, .action-bar {
        position: sticky;
        bottom: 0;
        background: rgba(255,255,255,0.96);
        backdrop-filter: blur(6px);
        padding: 10px;
        z-index: 50;
        box-shadow: 0 -4px 14px rgba(0,0,0,0.08);
    }

    /* Reduce noisy huge paddings (TailwindCSS common values) */
    .p-12 { padding: 1rem !important; }
    .p-10 { padding: 1rem !important; }
    .p-8  { padding: 0.875rem !important; }
    .p-6  { padding: 0.75rem !important; }
    .px-12 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .px-10 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .px-8  { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-12 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
    .py-10 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
    .py-8  { padding-top: 1rem !important; padding-bottom: 1rem !important; }

    /* Buttons in tailwind layouts: full width */
    .btn-full-mobile,
    .actions button,
    .actions .btn,
    .button-group button,
    .button-group .btn {
        width: 100%;
    }
}

@media (max-width: 480px) {
    body { padding: 8px 6px !important; }
    h1 { font-size: 1.3rem !important; }
    h2 { font-size: 1.1rem !important; }

    /* Iconic buttons keep label short */
    .label-mobile-hide { display: none !important; }

    /* Card pads tighter */
    .card, .panel, .section, .box, .bg-white {
        padding: 0.85rem !important;
        border-radius: 14px !important;
    }
}

/* Reduce sticky huge gradient backgrounds (file2/3) on mobile */
@media (max-width: 768px) {
    body[style*=&quot;background&quot;] {
        background-attachment: scroll !important;
    }
}

function getBackoffDelay(attempt){
    const base = Math.min(30000, 1500 * Math.pow(2, attempt));
    const jitter = Math.floor(Math.random() * 700);
    return base + jitter;
}

async function downscaleImageDataUrl(dataUrl, maxSide = MAX_IMAGE_SIDE){
    return new Promise((resolve) =&gt; {
        const img = new Image();
        img.onload = () =&gt; {
            const longest = Math.max(img.width || 0, img.height || 0);
            if(!longest || longest &lt;= maxSide){
                resolve({ dataUrl, width: img.width || 0, height: img.height || 0, resized: false });
                return;
            }
            const scale = maxSide / longest;
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement(&#x27;canvas&#x27;);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext(&#x27;2d&#x27;, { alpha: false });
            ctx.drawImage(img, 0, 0, w, h);
            resolve({ dataUrl: canvas.toDataURL(&#x27;image/jpeg&#x27;, 0.9), width: w, height: h, resized: true });
        };
        img.onerror = () =&gt; resolve({ dataUrl, width: 0, height: 0, resized: false });
        img.src = dataUrl;
    });
}

const iconImageCache = {};

async function preloadIcons() {
    const promises = Object.entries(iconImageUrls).map(([key,url]) =&gt; new Promise(resolve=&gt;{
        const img = new Image(); img.crossOrigin=&#x27;anonymous&#x27;;
        img.onload=()=&gt;{iconImageCache[key]=img;resolve();};
        img.onerror=()=&gt;resolve();
        img.src=url;
    }));
    await Promise.all(promises);
}

function hexAlpha(hex,a){const r=parseInt(hex.slice(1,3),16)||0,g=parseInt(hex.slice(3,5),16)||0,b=parseInt(hex.slice(5,7),16)||0;return `rgba(${r},${g},${b},${a})`;}

function drawIconImage(ctx,iconKey,x,y,size=80){
    const img=iconImageCache[iconKey];
    if(img&amp;&amp;img.complete){
        ctx.shadowColor=&#x27;rgba(0,0,0,0.15)&#x27;; ctx.shadowBlur=15; ctx.shadowOffsetX=0; ctx.shadowOffsetY=2;
        ctx.drawImage(img,x-size/2,y-size/2,size,size);
        ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
    } else {
        ctx.fillStyle=document.getElementById(&#x27;cMain&#x27;).value;
        ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
    }
}

    document.documentElement.style.setProperty(&#x27;--primary&#x27;, t.main);

    Object.keys(iconImageUrls).forEach(k=&gt;{
        iconImageUrls[k] = iconImageUrls[k].replace(/%23[0-9a-f]{6}/gi, hexColor);

}

async function processAll(){
    // Read key directly from field first, fallback to localStorage
    const inputVal = document.getElementById(&#x27;apiKeyInp&#x27;).value.trim();
    if(inputVal) saveKey(inputVal);
    const k = inputVal || getKey();
    if(!k){
        document.getElementById(&#x27;apiKeyInp&#x27;).style.borderColor=&#x27;#ff4757&#x27;;
        alert(&quot;⚠️ Cần nhập Gemini API Key!\n\nLấy miễn phí tại: https://ai.google.dev&quot;);
        document.getElementById(&#x27;apiKeyInp&#x27;).focus();
        return;
    }
    document.getElementById(&#x27;apiKeyInp&#x27;).style.borderColor=&#x27;&#x27;;
    if(!imgs.length){
        alert(&quot;📁 Hãy upload ít nhất 1 ảnh sản phẩm trước!&quot;);
        return;
    }
    document.getElementById(&#x27;loader&#x27;).style.display=&#x27;flex&#x27;;
    document.getElementById(&#x27;resArea&#x27;).innerHTML=&#x27;&#x27;;
    Object.keys(mktCards).forEach(k=&gt;delete mktCards[k]);
    let successCount = 0, failCount = 0;
    try{
        await preloadIcons();
        for(let idx = 0; idx &lt; imgs.length; idx++){
            const i = imgs[idx];
            try {
                const lines=i.desc.split(&#x27;\n&#x27;).filter(l=&gt;l.trim().length&gt;0);
                const plan=await callAI(i,Math.min(lines.length,4),k,idx,imgs.length);
                if(plan){ await drawMarketing(i,plan); successCount++; }
                if(idx &lt; imgs.length - 1) await sleep(BETWEEN_IMAGES_DELAY_MS);
            } catch(imgErr) {
                failCount++;
                const msg = imgErr.message || &#x27;&#x27;;
                const is421 = msg.includes(&#x27;421&#x27;);
                const is429 = msg.includes(&#x27;429&#x27;);
                const errHtml = `&lt;div style=&quot;padding:16px 20px;background:#fff3cd;border:1px solid #ffc107;border-radius:12px;font-size:13px;color:#7d5a00;&quot;&gt;
                    &lt;strong&gt;⚠️ Lỗi ảnh: ${i.name}&lt;/strong&gt;&lt;br&gt;${msg}
                    ${is421||is429 ? &#x27;&lt;br&gt;&lt;em&gt;👉 Đã tự retry nhiều lần nhưng vẫn chạm rate limit. Hãy đợi 1-2 phút rồi thử lại, hoặc giảm số ảnh chạy mỗi lượt.&lt;/em&gt;&#x27; : &#x27;&#x27;}
                &lt;/div&gt;`;
                document.getElementById(&#x27;resArea&#x27;).insertAdjacentHTML(&#x27;beforeend&#x27;, errHtml);
                if(is421 || is429) await sleep(2500);
            }
        }
    } finally {
        document.getElementById(&#x27;loader&#x27;).style.display=&#x27;none&#x27;;
        if(failCount &gt; 0 &amp;&amp; successCount === 0)
            alert(`❌ Tất cả ${failCount} ảnh đều lỗi. Kiểm tra API Key, quota Gemini và kết nối mạng.`);
    }
}

    const optimized = await downscaleImageDataUrl(img.data, MAX_IMAGE_SIDE);
    const mimeMatch = optimized.dataUrl.match(/^data:([a-zA-Z0-9]+\/[a-zA-Z0-9+.-]+);base64,/);
    const mimeType = mimeMatch ? mimeMatch[1] : &#x27;image/jpeg&#x27;;
    const imageBase64 = optimized.dataUrl.split(&#x27;,&#x27;)[1];

    for(let attempt = 0; attempt &lt;= MAX_RETRIES_429; attempt++){
        const controller = new AbortController();
        const timeoutId = setTimeout(() =&gt; controller.abort(), API_TIMEOUT_MS);
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`,{
                method:&#x27;POST&#x27;,
                headers:{&#x27;Content-Type&#x27;:&#x27;application/json&#x27;},
                signal: controller.signal,
                body:JSON.stringify({
                    contents:[{parts:[{text:prompt},{inlineData:{mimeType:mimeType,data:imageBase64}}]}],
                    generationConfig:{responseMimeType:&quot;application/json&quot;,temperature:0.1}
                })
            });
            clearTimeout(timeoutId);

            if(!res.ok){
                let errDetail = &#x27;&#x27;;
                try {
                    const errJson = await res.json();
                    errDetail = errJson?.error?.message || &#x27;&#x27;;
                } catch(_){}

                const isRetriable = [429, 500, 503].includes(res.status);
                if(isRetriable &amp;&amp; attempt &lt; MAX_RETRIES_429){
                    const delay = getBackoffDelay(attempt);
                    await sleep(delay);
                    continue;
                }
                throw new Error(`API Error ${res.status}${errDetail ? &#x27;: &#x27; + errDetail : &#x27;&#x27;}`);
            }

            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if(!text) throw new Error(&#x27;AI không trả về nội dung hợp lệ.&#x27;);

            let raw;
            try {
                raw = JSON.parse(text);
            } catch(e) {
                if(attempt &lt; 2){
                    await sleep(900 + attempt * 400);
                    continue;
                }
                throw new Error(&#x27;AI không trả về JSON hợp lệ. Thử lại.&#x27;);
            }

            if(raw.visualCues){
                raw.visualCues = raw.visualCues.map(cue=&gt;{
                    const words = (cue.label||&#x27;&#x27;).trim().split(/\s+/).filter(Boolean);
                    if(words.length &lt; 8) cue.label = cue.label + &#x27; (cần chỉnh sửa - quá ngắn)&#x27;;
                    return cue;
                });
            }
            return raw;
        } catch(err) {
            clearTimeout(timeoutId);
            const msg = err?.message || String(err || &#x27;&#x27;);
            const isAbort = err?.name === &#x27;AbortError&#x27;;
            const isRetriable = isAbort || msg.includes(&#x27;429&#x27;) || msg.includes(&#x27;503&#x27;) || msg.includes(&#x27;500&#x27;);
            if(isRetriable &amp;&amp; attempt &lt; MAX_RETRIES_429){
                await sleep(getBackoffDelay(attempt));
                continue;
            }
            if(msg.includes(&#x27;429&#x27;)){
                throw new Error(`API Error 429: Đã vượt quota/rate limit của Gemini cho ảnh ${imageIndex + 1}/${totalImages}. Hãy đợi 1-2 phút, giảm số ảnh mỗi lượt, hoặc kiểm tra quota của key trong AI Studio.`);
            }
            if(isAbort){
                throw new Error(&#x27;API timeout: Gemini phản hồi quá lâu, hãy thử lại với ảnh nhỏ hơn.&#x27;);
            }
            throw err;
        }
    }

    throw new Error(&#x27;Không thể gọi Gemini sau nhiều lần retry.&#x27;);
}

async function renderMktCanvas(canvas, imgObj, ai, customIcons) {
    const W=1200, H=1600;
    canvas.width=W; canvas.height=H;
    const ctx=canvas.getContext(&#x27;2d&#x27;);
    const cM=document.getElementById(&#x27;cMain&#x27;).value, cT=document.getElementById(&#x27;cText&#x27;).value;

    // Background
    if(currentBgStyle===&#x27;gradient&#x27;){
        const g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,&#x27;#ffffff&#x27;); g.addColorStop(1,&#x27;#f0f0f0&#x27;);
        ctx.fillStyle=g;
    } else { ctx.fillStyle=&#x27;#fff&#x27;; }
    ctx.fillRect(0,0,W,H);

    // Layout zones
    const MARGIN = 240;          // left/right margin width for callouts
    const TOP_H  = 130;          // headline zone
    const BOT_H  = 80;           // bottom padding
    const IMG_W  = W - MARGIN*2; // 860px product zone
    const IMG_H  = H - TOP_H - BOT_H;

    // Load &amp; draw product image
    const mainImg = new Image(); mainImg.src = imgObj.data;
    await new Promise(r=&gt;{mainImg.onload=r; mainImg.onerror=r;});
    await document.fonts.ready;
    // weight-200 may not be exposed to Canvas 2D on all browsers — check and fallback
    const headlineFont = document.fonts.check(&quot;200 68px &#x27;Barlow&#x27;&quot;)
        ? &quot;200 68px &#x27;Barlow&#x27;,sans-serif&quot;
        : &quot;300 64px &#x27;Barlow&#x27;,sans-serif&quot;;
    const scale = Math.min(IMG_W / mainImg.width, IMG_H / mainImg.height);
    const iw = mainImg.width*scale, ih = mainImg.height*scale;
    const ix = MARGIN + (IMG_W-iw)/2;
    const iy = TOP_H  + (IMG_H-ih)/2;
    ctx.drawImage(mainImg, ix, iy, iw, ih);

    // Headline
    ctx.fillStyle=cM; ctx.textAlign=&#x27;center&#x27;;
    ctx.font = headlineFont;
    ctx.fillText(ai.headline.toUpperCase(), W/2, 120);

    // ── Callout layout ──
    const cues = Array.isArray(ai?.visualCues) ? ai.visualCues : [];
    const leftCues  = cues.filter(c=&gt;c.x&lt;=50).sort((a,b)=&gt;a.y-b.y);
    const rightCues = cues.filter(c=&gt;c.x&gt;50).sort((a,b)=&gt;a.y-b.y);

    // Icon+label block dimensions
    const ICON_R = 31;   // icon circle radius (×1.2)
    const LBL_FS = 38;   // label font size (reduced to fit margin)
    const LBL_LH = 48;   // label line height
    const BLOCK_H= ICON_R*2 + 10 + LBL_FS*4 + 20; // ~220px per block (4 lines)

    // Spread blocks evenly within image height
    function blockYs(n) {
        if(n===0) return [];
        const total = IMG_H - 40;
        const step  = total / n;
        return Array.from({length:n}, (_,i)=&gt; TOP_H + 20 + step*(i+0.5));
    }

    const leftYs  = blockYs(leftCues.length);
    const rightYs = blockYs(rightCues.length);

    function drawCallout(cue, idx, isL, blockY) {
        // Dot position on product
        const dotX = ix + (cue.x/100)*iw;
        const dotY = iy + (cue.y/100)*ih;

        // Block position in margin
        const blockCX = isL ? MARGIN/2 : W - MARGIN/2;
        const iconCY  = blockY;
        const lineEndX= isL ? MARGIN-4 : W-MARGIN+4;

        // ── Line: dot → step → block ──
        ctx.strokeStyle = cM; ctx.lineWidth = 1.8; ctx.setLineDash([6,5]);
        ctx.beginPath();
        ctx.moveTo(dotX, dotY);
        ctx.lineTo(lineEndX, iconCY);  // straight diagonal to margin edge
        ctx.stroke();
        ctx.setLineDash([]);

        // ── Dot ──
        ctx.fillStyle = cM;
        ctx.beginPath(); ctx.arc(dotX, dotY, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = &#x27;#fff&#x27;;
        ctx.beginPath(); ctx.arc(dotX, dotY, 3.5, 0, Math.PI*2); ctx.fill();

        // ── Icon (no circle frame) ──
        const cueIdx = cues.indexOf(cue);
        const customImg = customIcons &amp;&amp; customIcons[cueIdx];
        if(customImg) {
            ctx.save(); ctx.beginPath(); ctx.arc(blockCX, iconCY, ICON_R, 0, Math.PI*2); ctx.clip();
            ctx.drawImage(customImg, blockCX-ICON_R, iconCY-ICON_R, ICON_R*2, ICON_R*2);
            ctx.restore();
        } else {
            drawIconImage(ctx, cue.iconKey||&#x27;mesh_lace&#x27;, blockCX, iconCY, ICON_R*2);
        }

        // ── Label — 4 words per line, max 4 lines (14 words), supports lblOffsetY ──
        const lblOffsetY = cue.lblOffsetY || 0;
        const labelTop = iconCY + ICON_R + 14 + lblOffsetY;
        ctx.fillStyle = cT;
        ctx.font = `200 ${LBL_FS}px &#x27;Barlow&#x27;,sans-serif`;

        // Left labels: left-aligned from x=14 (never overflow left edge)
        // Right labels: right-aligned from x=W-14 (never overflow right edge)
        const txtX     = isL ? 14 : W - 14;
        const txtAlign = isL ? &#x27;left&#x27; : &#x27;right&#x27;;
        ctx.textAlign  = txtAlign;

        // Split into groups of 4 words, max 14 words total
        const allWords = cue.label.toLowerCase().replace(/,/g,&#x27;&#x27;).split(/\s+/).filter(Boolean).slice(0,14);
        const lines = [];
        for(let i=0; i&lt;allWords.length; i+=4){
            lines.push(allWords.slice(i,i+4).join(&#x27; &#x27;));
        }
        lines.forEach((ln,li) =&gt; ctx.fillText(ln, txtX, labelTop + li*LBL_LH + LBL_FS));
    }

    leftCues.forEach((c,i)  =&gt; drawCallout(c, i, true,  leftYs[i]));
    rightCues.forEach((c,i) =&gt; drawCallout(c, i, false, rightYs[i]));
}

async function mktReplaceIcon(cardId, cueIdx, input) {
    if(!input.files[0]) return;
    const fr = new FileReader();
    fr.onload = async e =&gt; {
        const img = new Image();
        img.onload = async () =&gt; {
            mktCards[cardId].customIcons[cueIdx] = img;
            // Preview thumb
            const prev = document.getElementById(`${cardId}_iconprev_${cueIdx}`);
            if(prev) { prev.innerHTML=`&lt;img src=&quot;${e.target.result}&quot; style=&quot;width:100%;height:100%;object-fit:contain;&quot;&gt;`; }
            // Re-render canvas
            const {imgObj, ai, customIcons} = mktCards[cardId];
            const canvas = document.querySelector(`#${cardId} canvas`);
            await renderMktCanvas(canvas, imgObj, ai, customIcons);
        };
        img.src = e.target.result;
    };
    fr.readAsDataURL(input.files[0]);
}
const _mktRenderTimers = {};
async function mktUpdateCue(cardId, idx, axis, val) {
    mktCards[cardId].ai.visualCues[idx][axis] = val;
    // Debounce re-render for text input (300ms), immediate for sliders
    const isText = axis === &#x27;label&#x27;;
    if(isText){
        clearTimeout(_mktRenderTimers[cardId]);
        _mktRenderTimers[cardId] = setTimeout(async () =&gt; {
            const {imgObj, ai, customIcons} = mktCards[cardId];
            const canvas = document.querySelector(`#${cardId} canvas`);
            if(canvas) await renderMktCanvas(canvas, imgObj, ai, customIcons);
        }, 350);
    } else {
        const {imgObj, ai, customIcons} = mktCards[cardId];
        const canvas = document.querySelector(`#${cardId} canvas`);
        if(canvas) await renderMktCanvas(canvas, imgObj, ai, customIcons);
    }
}


async function mktDownload(cardId, name) {
    if(!mktCards[cardId]){ alert(&#x27;Card data không còn, vui lòng gen lại.&#x27;); return; }
    const {imgObj, ai, customIcons} = mktCards[cardId];
    const canvas = document.querySelector(`#${cardId} canvas`);
    await renderMktCanvas(canvas, imgObj, ai, customIcons);
    try {
        const dataUrl = canvas.toDataURL(&#x27;image/png&#x27;, 1.0);
        const a = document.createElement(&#x27;a&#x27;);
        a.download = `infographic_${name||&#x27;image&#x27;}.png`;
        a.href = dataUrl;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    } catch(e) {
        alert(&#x27;❌ Không thể xuất ảnh: &#x27; + e.message + &#x27;\n\nThử tải lại trang và gen lại.&#x27;);
    }
}

function mcIconSVG(key, color, strokeW) {

/* ── Custom icon upload — auto-tints to black to match text and removes white bg ── */
const mcIconUploads = { 0: null, 1: null, 2: null };

async function mcTintIconImage(src, color) {
    return new Promise(res =&gt; {
        const img = new Image();
        img.onload = () =&gt; {
            const SIZE = 96;
            const c = document.createElement(&#x27;canvas&#x27;);
            c.width = SIZE; c.height = SIZE;
            const ctx = c.getContext(&#x27;2d&#x27;);
            // Scale &amp; center the icon in the canvas
            const s = Math.min(SIZE / (img.naturalWidth || 1), SIZE / (img.naturalHeight || 1));
            const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
            ctx.drawImage(img, (SIZE - dw)/2, (SIZE - dh)/2, dw, dh);
            // Parse target color
            const cr = parseInt(color.slice(1,3), 16);
            const cg = parseInt(color.slice(3,5), 16);
            const cb = parseInt(color.slice(5,7), 16);
            // Pixel recolor: white-ish → transparent, dark → target color (alpha by darkness)
            const id = ctx.getImageData(0, 0, SIZE, SIZE);
            const d = id.data;
            for (let i = 0; i &lt; d.length; i += 4) {
                const r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
                if (a &lt; 10) continue;
                const lum = r * 0.299 + g * 0.587 + b * 0.114;
                const whiteness = Math.min(r, g, b);
                if (whiteness &gt; 230 &amp;&amp; a &gt; 200) {
                    d[i+3] = 0; // strip white background
                } else {
                    const intensity = (1 - lum/255) * (a/255);
                    d[i] = cr; d[i+1] = cg; d[i+2] = cb;
                    d[i+3] = Math.min(255, Math.round(intensity * 300));
                }
            }
            ctx.putImageData(id, 0, 0);
            res(c.toDataURL(&#x27;image/png&#x27;));
        };
        img.onerror = () =&gt; res(src); // fallback: original
        img.src = src;
    });
}

async function mcLoadIcon(i, inp) {
    if (!inp.files[0]) return;
    const fr = new FileReader();
    fr.onload = async e =&gt; {
        const original = e.target.result;
        mcIconUploads[i] = original;
        // Card icon — black to match text, 40px
        const tintedCard = await mcTintIconImage(original, &#x27;#000000&#x27;);
        $(&#x27;mc-b1-icon-&#x27; + i).innerHTML =
            `&lt;img src=&quot;${tintedCard}&quot; style=&quot;width:40px;height:40px;object-fit:contain;display:block;&quot;&gt;`;
        // Side thumbnail — slightly darker for visibility on white side panel
        const tintedThumb = await mcTintIconImage(original, &#x27;#666666&#x27;);
        $(&#x27;mc-thumb-&#x27; + i).innerHTML =
            `&lt;img src=&quot;${tintedThumb}&quot; style=&quot;width:18px;height:18px;object-fit:contain;display:block;&quot;&gt;`;
        // Reset dropdown to indicate &quot;custom&quot;
        const sel = $(&#x27;mc-sel-&#x27; + i);
        if (sel) sel.value = &#x27;&#x27;;
    };
    fr.readAsDataURL(inp.files[0]);
}

/* ── Hero title auto-shrink — never wraps, scales down to fit card width ── */
const MC_HERO_TITLE_BASE_PX = 17; // default font-size in CSS (đã giảm để fit khung 3:4 cứng)
function mcFitHeroTitle() {
    const h1 = document.querySelector(&#x27;#mc-card .mc-b1-title&#x27;);
    if (!h1 || h1.offsetParent === null) return; // panel hidden, skip
    h1.style.fontSize = &#x27;&#x27;; // reset to base
    const containerW = h1.clientWidth;
    const textW = h1.scrollWidth;
    if (textW &gt; containerW &amp;&amp; containerW &gt; 0) {
        const fitted = Math.floor(MC_HERO_TITLE_BASE_PX * containerW / textW * 0.98);
        h1.style.fontSize = Math.max(10, fitted) + &#x27;px&#x27;;
    }
}

/* ── B2 title setter — keeps the &quot;i&quot; of &quot;iBasic&quot; lowercase even with uppercase text-transform ── */
function mcSetB2Title(value) {
    const el = document.getElementById(&#x27;mc-b2-title-txt&#x27;);
    if (!el) return;
    // Escape HTML to prevent injection from user input
    const tmp = document.createElement(&#x27;div&#x27;);
    tmp.textContent = value;
    let html = tmp.innerHTML;
    // Match any casing of &quot;iBasic&quot; and wrap the leading &quot;i&quot; so CSS uppercase skips it
    html = html.replace(/i(basic)/gi, &#x27;&lt;span class=&quot;mc-keep-lower&quot;&gt;i&lt;/span&gt;$1&#x27;);
    el.innerHTML = html;
}

/* ── Text setters ── */
function mcSetText(id, val) {
    const el = $(id);
    if (el) el.textContent = val;
}
function mcSetTextUpper(id, val) {
    const el = $(id);
    if (el) el.textContent = (val || &#x27;&#x27;).toUpperCase();
}

/* ── Material % auto-sync ── */
function mcSyncMatPct(val) {
    const a = Math.min(99, Math.max(1, parseInt(val) || 1));
    const b = 100 - a;
    $(&#x27;mc-b3-num-main&#x27;).textContent = a;
    $(&#x27;mc-b3-num-sub&#x27;).textContent  = b;
    const bInp = $(&#x27;mc-mat-b-pct&#x27;);
    if (bInp) bInp.value = b;
}

/* ── Image upload (hero: 3:4 cover-fit | care, cta: freesize) ── */
function mcLoadImg(slot, inp) {
    if (!inp.files[0]) return;
    const fr = new FileReader();
    fr.onload = e =&gt; {
        const src = e.target.result;
        // 1) Update the actual preview image inside the card
        const wrapId = slot === &#x27;hero&#x27; ? &#x27;mc-b1-image&#x27; :
                       slot === &#x27;care&#x27; ? &#x27;mc-b4-image&#x27; : &#x27;mc-b5-image&#x27;;
        const wrap = $(wrapId);
        wrap.innerHTML = &#x27;&#x27;;
        wrap.classList.add(&#x27;has-img&#x27;);         // ► background trắng để lề contain sạch
        const cardImg = document.createElement(&#x27;img&#x27;);
        cardImg.src = src;
        wrap.appendChild(cardImg);
        // 2) Update side-panel thumbnail
        const frame = $(&#x27;mc-thumb-&#x27; + slot);
        if (frame) {
            // Clear placeholder
            frame.innerHTML = &#x27;&#x27;;
            const tImg = document.createElement(&#x27;img&#x27;);
            tImg.src = src;
            frame.appendChild(tImg);
            frame.classList.add(&#x27;has-img&#x27;);
            // For freesize variants, drop the gray placeholder bg so the image shows clean
            if (frame.classList.contains(&#x27;mc-frame-free&#x27;)) {
                frame.style.background = &#x27;transparent&#x27;;
                frame.style.minHeight = &#x27;0&#x27;;
            }
        }
        // 3) Show image adjustment controls cho slot này
        const ctrl = $(&#x27;mc-ctrl-&#x27; + slot);
        if (ctrl) ctrl.classList.add(&#x27;active&#x27;);
    };
    fr.readAsDataURL(inp.files[0]);
}

/* ════════════════════════════════════════════════
   IMAGE ADJUSTMENT — zoom + transform-origin cho ảnh contain
   Ảnh luôn CONTAIN (không bao giờ stretch/crop).
   Zoom chỉ scale ảnh từ một điểm origin (top/center/bottom).
════════════════════════════════════════════════ */
function _mcImgWrap(slot) {
    const wrapId = slot === &#x27;hero&#x27; ? &#x27;mc-b1-image&#x27; :
                   slot === &#x27;care&#x27; ? &#x27;mc-b4-image&#x27; : &#x27;mc-b5-image&#x27;;
    return $(wrapId);
}

function mcSetImgZoom(slot, val) {
    const wrap = _mcImgWrap(slot);
    if (!wrap) return;
    const img = wrap.querySelector(&#x27;img&#x27;);
    if (img) {
        img.style.setProperty(&#x27;--img-zoom&#x27;, val);
    }
    const lbl = $(`mc-zoom-${slot}-val`);
    if (lbl) lbl.textContent = parseFloat(val).toFixed(2) + &#x27;x&#x27;;
}

function mcSetImgPos(slot, origin, btn) {
    const wrap = _mcImgWrap(slot);
    if (!wrap) return;
    const img = wrap.querySelector(&#x27;img&#x27;);
    if (img) img.style.setProperty(&#x27;--img-origin&#x27;, origin);
    if (btn &amp;&amp; btn.parentElement) {
        btn.parentElement.querySelectorAll(&#x27;.mc-pos-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
        btn.classList.add(&#x27;active&#x27;);
    }
}

/* ► FIT toggle kept for care/cta slots only; hero always contain */
function mcSetImgFit(slot, fit, btn) {
    const wrap = _mcImgWrap(slot);
    if (!wrap) return;
    wrap.style.setProperty(&#x27;--img-fit&#x27;, fit);
    if (btn &amp;&amp; btn.parentElement) {
        btn.parentElement.querySelectorAll(&#x27;.mc-pos-btn&#x27;).forEach(b =&gt; b.classList.remove(&#x27;active&#x27;));
        btn.classList.add(&#x27;active&#x27;);
    }
}

function mcResetImg(slot) {
    const wrap = _mcImgWrap(slot);
    if (!wrap) return;
    const img = wrap.querySelector(&#x27;img&#x27;);
    if (img) {
        img.style.removeProperty(&#x27;--img-zoom&#x27;);
        img.style.removeProperty(&#x27;--img-origin&#x27;);
    }
    wrap.style.removeProperty(&#x27;--img-fit&#x27;);
    // Reset slider
    const slider = $(&#x27;mc-zoom-&#x27; + slot);
    if (slider) slider.value = 1;
    const lbl = $(`mc-zoom-${slot}-val`);
    if (lbl) lbl.textContent = &#x27;1.00x&#x27;;
    const ctrl = $(&#x27;mc-ctrl-&#x27; + slot);
    if (ctrl) {
        ctrl.querySelectorAll(&#x27;.mc-pos-btn[data-pos]&#x27;).forEach(b =&gt; {
            b.classList.toggle(&#x27;active&#x27;, b.dataset.pos === &#x27;center center&#x27;);
        });
        ctrl.querySelectorAll(&#x27;.mc-pos-btn[data-fit]&#x27;).forEach(b =&gt; {
            b.classList.toggle(&#x27;active&#x27;, b.dataset.fit === &#x27;contain&#x27;);
        });
    }
}

/* ════════════════════════════════════════════════
   EXPORT — html2canvas per block
   4 output images at 1080px wide.
   1: Hero            (3:4 → 1080×1440)
   2: Benefits        (1:1 → 1080×1080)
   3: Material+Care   (3:4 → 1080×1440) — combined
   4: CTA             (1:1 → 1080×1080)
════════════════════════════════════════════════ */

const BLOCK_CONFIG = {
    1: { selector: &#x27;.mc-b1-hero&#x27;,      name: &#x27;Hero&#x27;,          ratio: 3/4, bg: &#x27;#FFFFFF&#x27; },
    2: { selector: &#x27;.mc-b2-benefits&#x27;,  name: &#x27;Benefits&#x27;,      ratio: 3/4, bg: &#x27;#FFFFFF&#x27; },
    3: { selector: &#x27;#mc-combined-3-4&#x27;, name: &#x27;Material-Care&#x27;, ratio: 3/4, bg: &#x27;#FFFFFF&#x27; },
    4: { selector: &#x27;.mc-b5-cta&#x27;,       name: &#x27;CTA&#x27;,           ratio: 3/4, bg: &#x27;#FFFFFF&#x27; },
};

async function mcRenderBlock(blockNum) {
    const cfg = BLOCK_CONFIG[blockNum];
    if (!cfg) throw new Error(&#x27;Invalid block: &#x27; + blockNum);
    const card = $(&#x27;mc-card&#x27;);
    const block = card.querySelector(cfg.selector) || document.querySelector(cfg.selector);
    if (!block) throw new Error(&#x27;Block not found: &#x27; + cfg.selector);

    // Ensure hero title is fitted before capture (in case viewport changed)
    mcFitHeroTitle();

    // SCALE = 1080 / block.offsetWidth → pixel-perfect, không bao giờ stretch
    const SCALE = 1080 / block.offsetWidth;

    const blockCanvas = await html2canvas(block, {
        scale: SCALE,
        useCORS: true,
        allowTaint: false,
        backgroundColor: cfg.bg,
        logging: false,
        scrollX: -window.scrollX,
        scrollY: -window.scrollY,
        width:  block.offsetWidth,
        height: block.offsetHeight,
    });

    // Output canvas kích thước chính xác = blockCanvas (không resize, không stretch)
    // Preview 400×533px × SCALE → xuất 1080×1440px pixel-perfect
    if (blockCanvas.width === 1080) {
        return { canvas: blockCanvas, name: cfg.name };
    }
    // Fallback: chỉ điều chỉnh width về 1080, giữ nguyên tỷ lệ thực tế
    const outW = 1080;
    const outH = Math.round(blockCanvas.height * (outW / blockCanvas.width));
    const out = document.createElement(&#x27;canvas&#x27;);
    out.width = outW;
    out.height = outH;
    const ctx = out.getContext(&#x27;2d&#x27;);
    ctx.fillStyle = cfg.bg;
    ctx.fillRect(0, 0, outW, outH);
    ctx.drawImage(blockCanvas, 0, 0, blockCanvas.width, blockCanvas.height, 0, 0, outW, outH);
    return { canvas: out, name: cfg.name };
}

async function mcExportBlock(blockNum) {
    const code = ($(&#x27;mc-prod-code&#x27;)?.value || &#x27;iBasic&#x27;).trim() || &#x27;iBasic&#x27;;
    const card = $(&#x27;mc-card&#x27;);
    card.classList.add(&#x27;exporting&#x27;);
    try {
        const { canvas, name } = await mcRenderBlock(blockNum);
        const fname = `${code}_${blockNum}_${name}.png`;
        const dataUrl = canvas.toDataURL(&#x27;image/png&#x27;, 1);
        const a = document.createElement(&#x27;a&#x27;);
        a.download = fname; a.href = dataUrl;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) {
        const hint = e.message.includes(&#x27;tainted&#x27;) || e.message.includes(&#x27;SecurityError&#x27;)
            ? &#x27;\n\n→ Canvas bị tainted: ảnh có cross-origin. Thử tải lại trang.&#x27; : &#x27;&#x27;;
        alert(&#x27;Lỗi xuất khối &#x27; + blockNum + &#x27;: &#x27; + e.message + hint);
    } finally {
        card.classList.remove(&#x27;exporting&#x27;);
    }
}

async function mcExportAll() {
    const code = ($(&#x27;mc-prod-code&#x27;)?.value || &#x27;iBasic&#x27;).trim() || &#x27;iBasic&#x27;;
    const btn = document.querySelector(&#x27;.mc-export-btn.all&#x27;);
    const orig = btn.innerHTML;
    btn.innerHTML = &#x27;⏳ Đang xuất 4 ảnh...&#x27;;
    btn.disabled = true;
    const card = $(&#x27;mc-card&#x27;);
    card.classList.add(&#x27;exporting&#x27;);
    try {
        const total = Object.keys(BLOCK_CONFIG).length;
        for (let i = 1; i &lt;= total; i++) {
            const { canvas, name } = await mcRenderBlock(i);
            const fname = `${code}_${i}_${name}.png`;
            const dataUrl = canvas.toDataURL(&#x27;image/png&#x27;, 1);
            const a = document.createElement(&#x27;a&#x27;);
            a.download = fname; a.href = dataUrl;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            await new Promise(r =&gt; setTimeout(r, 400));
        }
        btn.innerHTML = `✓ Đã xuất ${total} ảnh (1080×1440)`;
        setTimeout(() =&gt; { btn.innerHTML = orig; btn.disabled = false; }, 2500);
    } catch (e) {
        const hint = e.message.includes(&#x27;tainted&#x27;) || e.message.includes(&#x27;SecurityError&#x27;)
            ? &#x27; (canvas tainted — tải lại trang)&#x27; : &#x27;&#x27;;
        alert(&#x27;Lỗi: &#x27; + e.message + hint);
        btn.innerHTML = orig;
        btn.disabled = false;
    } finally {
        card.classList.remove(&#x27;exporting&#x27;);
    }
}

// Init: build icon selects when panel first opens
document.querySelector(&#x27;[onclick=&quot;switchMode(\&#x27;mota\&#x27;)&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    setTimeout(mcBuildSelects, 100);
});
// Also init immediately in case it&#x27;s the default panel
mcBuildSelects();

/* === iBasic Ecommerce — Global Mobile UX Layer === */
:root { --ibx-tap: 44px; }

* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
img, video, canvas, svg { max-width: 100%; height: auto; }

/* Prevent iOS auto-zoom on focus */
input, select, textarea, button {
    font-size: 16px;
}

@media (max-width: 820px) {
    /* Reduce big margins/padding on common wrappers */
    body { padding: 12px 8px !important; margin: 0 !important; }
    .container, .wrapper, .main, .content, .page,
    .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl, .max-w-3xl,
    .max-w-2xl, .max-w-xl, .max-w-lg, .max-w-md {
        max-width: 100% !important;
        padding-left: 10px !important;
        padding-right: 10px !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    /* Make wide cards/sections flow */
    .card, .panel, .section, .box, .bg-white,
    .rounded-xl, .rounded-2xl, .rounded-3xl {
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    /* Larger tap targets for buttons */
    button, .btn, [role=&quot;button&quot;], input[type=&quot;button&quot;], input[type=&quot;submit&quot;], input[type=&quot;reset&quot;] {
        min-height: var(--ibx-tap);
        padding-top: 0.6rem;
        padding-bottom: 0.6rem;
    }

    /* Make grids stack */
    .grid, .columns, [class*=&quot;grid-cols-&quot;] {
        grid-template-columns: 1fr !important;
        gap: 0.75rem !important;
    }
    .grid-cols-2-keep { grid-template-columns: 1fr 1fr !important; }

    /* Flex rows that should wrap */
    .row, .form-row, .field-row, .actions, .toolbar, .button-row,
    .flex-row, .header-row, .actions-row {
        flex-wrap: wrap !important;
        gap: 0.5rem !important;
    }

    /* Inputs full width */
    input[type=&quot;text&quot;], input[type=&quot;number&quot;], input[type=&quot;email&quot;],
    input[type=&quot;search&quot;], input[type=&quot;url&quot;], input[type=&quot;tel&quot;],
    input[type=&quot;date&quot;], input[type=&quot;time&quot;], input[type=&quot;datetime-local&quot;],
    select, textarea {
        width: 100%;
        max-width: 100%;
    }

    /* Tables become horizontally scrollable to prevent layout break */
    table {
        display: block;
        width: 100% !important;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* Headings: smaller on mobile */
    h1 { font-size: 1.5rem !important; line-height: 1.25 !important; }
    h2 { font-size: 1.25rem !important; line-height: 1.3 !important; }
    h3 { font-size: 1.1rem !important; line-height: 1.35 !important; }

    /* Generic modals */
    .modal, .dialog, [class*=&quot;modal-&quot;], [class*=&quot;dialog-&quot;] {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        border-radius: 12px !important;
    }

    /* Tabs: scroll horizontally */
    .tabs, .tab-bar, .nav-tabs, [role=&quot;tablist&quot;] {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        flex-wrap: nowrap !important;
        white-space: nowrap;
    }

    /* Sticky bottom action bar pattern (if present) */
    .sticky-actions, .bottom-bar, .action-bar {
        position: sticky;
        bottom: 0;
        background: rgba(255,255,255,0.96);
        backdrop-filter: blur(6px);
        padding: 10px;
        z-index: 50;
        box-shadow: 0 -4px 14px rgba(0,0,0,0.08);
    }

    /* Reduce noisy huge paddings (TailwindCSS common values) */
    .p-12 { padding: 1rem !important; }
    .p-10 { padding: 1rem !important; }
    .p-8  { padding: 0.875rem !important; }
    .p-6  { padding: 0.75rem !important; }
    .px-12 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .px-10 { padding-left: 1rem !important; padding-right: 1rem !important; }
    .px-8  { padding-left: 1rem !important; padding-right: 1rem !important; }
    .py-12 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
    .py-10 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
    .py-8  { padding-top: 1rem !important; padding-bottom: 1rem !important; }

    /* Buttons in tailwind layouts: full width */
    .btn-full-mobile,
    .actions button,
    .actions .btn,
    .button-group button,
    .button-group .btn {
        width: 100%;
    }
}

@media (max-width: 480px) {
    body { padding: 8px 6px !important; }
    h1 { font-size: 1.3rem !important; }

    .label-mobile-hide { display: none !important; }

        border-radius: 14px !important;

/* Reduce sticky huge gradient backgrounds (file2/3) on mobile */
@media (max-width: 768px) {
    body[style*=&quot;background&quot;] {
        background-attachment: scroll !important;
    }
}

        // Format currency in Vietnamese Dong
        function formatVND(value) {
            if (value &gt;= 1000000000) {
                return `${(value / 1000000000).toFixed(1)}B VND`;
            }
            if (value &gt;= 1000000) {
                return `${(value / 1000000).toFixed(1)}M VND`;
            }
            if (value &gt;= 1000) {
                return `${(value / 1000).toFixed(1)}K VND`;
            }
            return `${value.toFixed(0)} VND`;
        }

        // Format value based on unit
        function formatValue(value, unit) {
            if (unit === &#x27;VND&#x27;) return formatVND(value);
            if (unit === &#x27;%&#x27;) return `${value.toFixed(2)}%`;
            // Handle large count values
            if (unit === &#x27;count&#x27; &amp;&amp; value &gt;= 1000000) {
                return `${(value / 1000000).toFixed(1)}M`;
            }
            if (unit === &#x27;count&#x27; &amp;&amp; value &gt;= 1000) {
                return `${(value / 1000).toFixed(1)}K`;
            }
            return value.toFixed(0);
        }

        // Calculate metrics based on input data
        function calculateMetrics(inputData) {
            const calculatedData = { ...inputData };
            
            Object.entries(metricsConfig).forEach(([metric, config]) =&gt; {
                if (config.type === &#x27;calculated&#x27; &amp;&amp; config.formula) {
                    calculatedData[metric] = config.formula(inputData);
                }
            });
            
            return calculatedData;
        }

        // Calculate percentage change for MOM comparison
        function calculatePercentageChange(current, previous) {
            if (!previous || previous === 0) return 0;
            return ((current - previous) / previous) * 100;
        }

        // Enhanced comparison badge with good/bad performance logic
        function createComparisonBadge(change, metricName) {
            let icon, className;
            const metricConfig = metricsConfig[metricName];
            const goodDirection = metricConfig ? metricConfig.goodDirection : &#x27;higher&#x27;;
            
            // Determine if change is good or bad based on metric type
            let isGood = false;
            if (goodDirection === &#x27;higher&#x27;) {
                isGood = change &gt; 0;
            } else if (goodDirection === &#x27;lower&#x27;) {
                isGood = change &lt; 0;
            }
            
            if (Math.abs(change) &gt; 5) {
                if (isGood) {
                    icon = &#x27;fas fa-arrow-up&#x27;;
                    className = &#x27;comparison-positive&#x27;;
                } else {
                    icon = &#x27;fas fa-arrow-down&#x27;;
                    className = &#x27;comparison-negative&#x27;;
                }
            } else {
                icon = &#x27;fas fa-minus&#x27;;
                className = &#x27;comparison-neutral&#x27;;
            }

            return `
                &lt;span class=&quot;${className} comparison-badge&quot;&gt;
                    &lt;i class=&quot;${icon}&quot;&gt;&lt;/i&gt;
                    ${change &gt; 0 ? &#x27;+&#x27; : &#x27;&#x27;}${change.toFixed(1)}%
                &lt;/span&gt;
            `;
        }

        // Show notification helper
        function showNotification(message, type = &#x27;success&#x27;) {
            const notification = document.createElement(&#x27;div&#x27;);
            const bgColor = type === &#x27;success&#x27; ? &#x27;bg-green-500&#x27; : &#x27;bg-red-500&#x27;;
            const icon = type === &#x27;success&#x27; ? &#x27;fas fa-check&#x27; : &#x27;fas fa-exclamation-triangle&#x27;;
            
            notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            notification.innerHTML = `&lt;i class=&quot;${icon} mr-2&quot;&gt;&lt;/i&gt;${message}`;
            document.body.appendChild(notification);
            setTimeout(() =&gt; {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 3000);
        }

        function showStatusMessage(containerId, message, type = &#x27;success&#x27;) {
            const container = document.getElementById(containerId);

            const messageClass = type === &#x27;success&#x27; ? &#x27;success-message&#x27; : &#x27;error-message&#x27;;

                const sampleData = baseSampleData.map(row =&gt; {

                                    dataType === &#x27;15th, 25th&#x27; ? 1.2 : 1.0;
                    
                    const adjustedRow = { ...row };
                    Object.keys(adjustedRow).forEach(key =&gt; {
                        if (key !== &#x27;date&#x27; &amp;&amp; key !== &#x27;type&#x27; &amp;&amp; typeof adjustedRow[key] === &#x27;number&#x27;) {
                            adjustedRow[key] = Math.round(adjustedRow[key] * multiplier);
                        }
                    });
                    return adjustedRow;
                });

                // Create Excel file and download
                const worksheet = XLSX.utils.json_to_sheet(sampleData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, dataType);

                XLSX.writeFile(workbook, `Enhanced_Sample_${dataType.replace(/[^a-zA-Z0-9]/g, &#x27;_&#x27;)}.xlsx`);
                
                // Show success message
                showNotification(`Đã tải file mẫu ${dataType} với Target &amp; MOM data`, &#x27;success&#x27;);
                
            } catch (error) {
                console.error(&#x27;Error generating sample file:&#x27;, error);
                showNotification(`Lỗi khi tạo file mẫu: ${error.message}`, &#x27;error&#x27;);
            }
        }

        // Enhanced file upload handler
        function handleFileUpload(event, dataType) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const workbook = XLSX.read(e.target.result, { type: &#x27;binary&#x27; });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: &quot;&quot; });

                    const processedData = jsonData.map(row =&gt; calculateMetrics(row));
                    
                    // Separate Target, Compare, and other data
                    processedData.forEach(row =&gt; {
                        const dateStr = (row.date || row.Date || &#x27;&#x27;).toString().toLowerCase();
                        const typeStr = (row.type || &#x27;&#x27;).toString().toLowerCase();
                        
                        if (dateStr.includes(&#x27;target&#x27;) || typeStr.includes(&#x27;target&#x27;)) {
                            if (!targetData[dataType]) targetData[dataType] = {};
                            targetData[dataType] = row;
                        } else if (dateStr.includes(&#x27;compare&#x27;) || typeStr.includes(&#x27;compare&#x27;) || 
                                 dateStr.includes(&#x27;mom&#x27;) || typeStr.includes(&#x27;mom&#x27;)) {
                            if (!compareData[dataType]) compareData[dataType] = {};
                            compareData[dataType] = row;
                        }
                    });
                    
                    uploadedData[dataType] = processedData;
                    
                    document.getElementById(`status-${dataType}`).innerHTML = 
                        `&lt;span class=&quot;status-badge&quot;&gt;✓ ${processedData.length} rows uploaded&lt;/span&gt;`;
                    
                    if (!selectedDataTypes.includes(dataType)) {
                        selectedDataTypes.push(dataType);
                    }
                    
                    updateDataTypeSelection();
                    updatePivotData();
                    updateRunRateOverview(); // NEW: Update Run Rate Overview on data load
                } catch (error) {
                    showNotification(`Lỗi khi đọc file Excel: ${error.message}`, &#x27;error&#x27;);
                }
            };
            reader.readAsBinaryString(file);
        }

        // Update data type selection
        function updateDataTypeSelection() {
            const container = document.getElementById(&#x27;dataTypeCheckboxes&#x27;);
            container.innerHTML = &#x27;&#x27;;
            
            const dataTypes = [&#x27;BAU&#x27;, &#x27;Double day&#x27;, &#x27;15th, 25th&#x27;];
            dataTypes.forEach(dataType =&gt; {
                if (uploadedData[dataType]) {
                    const label = document.createElement(&#x27;label&#x27;);
                    label.className = &#x27;flex items-center cursor-pointer&#x27;;
                    label.innerHTML = `
                        &lt;input type=&quot;checkbox&quot; ${selectedDataTypes.includes(dataType) ? &#x27;checked&#x27; : &#x27;&#x27;} 
                               onchange=&quot;toggleDataType(&#x27;${dataType}&#x27;)&quot; class=&quot;mr-3 scale-125&quot;&gt;
                        &lt;span class=&quot;data-type-badge&quot;&gt;${dataType}&lt;/span&gt;
                    `;
                    container.appendChild(label);
                }
            });
            
            if (Object.keys(uploadedData).length &gt; 0) {
                document.getElementById(&#x27;dataTypeSelection&#x27;).style.display = &#x27;block&#x27;;
            }
        }

        // Toggle data type selection
        function toggleDataType(dataType) {
            if (selectedDataTypes.includes(dataType)) {
                selectedDataTypes = selectedDataTypes.filter(t =&gt; t !== dataType);
            } else {
                selectedDataTypes.push(dataType);

        // Identify bad performance metrics với logic tốt/xấu chi tiết
        function identifyBadPerformanceMetrics() {
            if (!pivotData) return [];

            const badMetrics = [];
            const todayData = pivotData[&#x27;Today&#x27;];
            const compareData = pivotData[&#x27;Compare MOM&#x27;];
            
            if (!todayData || !compareData) return [];

            Object.keys(metricsConfig).forEach(metric =&gt; {
                selectedDataTypes.forEach(dataType =&gt; {
                    const currentValue = todayData[dataType]?.[metric];
                    const previousValue = compareData[dataType]?.[metric];
                    const targetValue = pivotData[&#x27;Target&#x27;]?.[dataType]?.[metric];
                    const metricConfig = metricsConfig[metric];

                    if (currentValue !== undefined &amp;&amp; previousValue !== undefined &amp;&amp; metricConfig) {
                        const change = calculatePercentageChange(currentValue, previousValue);
                        const goodDirection = metricConfig.goodDirection;
                        
                        // Xác định metric có performance xấu hay không
                        let isBadPerformance = false;
                        
                        if (goodDirection === &#x27;higher&#x27;) {
                            // Với metrics càng cao càng tốt (GMV, Order, CR, etc.)
                            isBadPerformance = change &lt; -5; // Giảm &gt; 5% là xấu
                        } else if (goodDirection === &#x27;lower&#x27;) {
                            // Với metrics càng thấp càng tốt (Cost, CIR, CPC, etc.)
                            isBadPerformance = change &gt; 5; // Tăng &gt; 5% là xấu
                        }
                        
                        // Kiểm tra so với target (nếu có)
                        const isBelowTarget = targetValue ? 
                            (goodDirection === &#x27;higher&#x27; ? (currentValue / targetValue) &lt; 0.9 : 
                             goodDirection === &#x27;lower&#x27; ? (currentValue / targetValue) &gt; 1.1 : false) : 
                            false;
                        
                        if (isBadPerformance || isBelowTarget) {
                            badMetrics.push({
                                name: `${metric} (${dataType})`,
                                current: currentValue,
                                previous: previousValue,
                                target: targetValue,
                                change: change,
                                unit: metricConfig.unit,
                                category: metricConfig.category,
                                goodDirection: goodDirection,
                                reason: isBadPerformance ? &#x27;MOM Performance&#x27; : &#x27;Below Target&#x27;
                            });
                        }
                    }
                });
            });

            return badMetrics.sort((a, b) =&gt; {
                // Sắp xếp theo mức độ nghiêm trọng
                if (a.goodDirection === &#x27;higher&#x27;) {
                    return a.change - b.change; // Metric giảm nhiều nhất lên đầu
                } else {
                    return b.change - a.change; // Metric tăng nhiều nhất lên đầu
                }
            });
        }

        // Enhanced pivot table với group theo category
        function renderPivotTable() {
            if (!pivotData) return;

            const dates = Object.keys(pivotData).sort((a, b) =&gt; {
                // Sort order: Target, Compare MOM, Today, then others
                if (a.includes(&#x27;Target&#x27;)) return -1;
                if (b.includes(&#x27;Target&#x27;)) return 1;
                if (a.includes(&#x27;Compare&#x27;)) return -1;
                if (b.includes(&#x27;Compare&#x27;)) return 1;
                if (a.includes(&#x27;Today&#x27;)) return -1;
                if (b.includes(&#x27;Today&#x27;)) return 1;
                return a.localeCompare(b);
            });
            
            // Group metrics by category
            const metricsGrouped = {};
            Object.entries(metricsConfig).forEach(([metric, config]) =&gt; {
                const category = config.category || &#x27;Other&#x27;;
                if (!metricsGrouped[category]) metricsGrouped[category] = [];
                metricsGrouped[category].push(metric);
            });
            
            let tableHTML = `
                &lt;thead class=&quot;bg-gradient-to-r from-purple-500 to-blue-500 text-white&quot;&gt;
                    &lt;tr&gt;
                        &lt;th class=&quot;px-6 py-4 text-left text-sm font-semibold rounded-tl-2xl&quot;&gt;Category / Metric&lt;/th&gt;
                        ${dates.map((date, index) =&gt; `
                            &lt;th class=&quot;px-6 py-4 text-left text-sm font-semibold ${index === dates.length - 1 ? &#x27;rounded-tr-2xl&#x27; : &#x27;&#x27;}&quot;&gt;
                                ${date}
                                ${date.includes(&#x27;Today&#x27;) ? &#x27;&lt;br&gt;&lt;small&gt;vs MOM&lt;/small&gt;&#x27; : &#x27;&#x27;}
                            &lt;/th&gt;
                        `).join(&#x27;&#x27;)}
                    &lt;/tr&gt;
                &lt;/thead&gt;
                &lt;tbody&gt;
            `;

            let rowIndex = 0;
            Object.entries(metricsGrouped).forEach(([category, metrics]) =&gt; {
                // Category header row
                const bgClass = rowIndex % 2 === 0 ? &#x27;bg-blue-50&#x27; : &#x27;bg-purple-50&#x27;;
                tableHTML += `
                    &lt;tr class=&quot;${bgClass}&quot;&gt;
                        &lt;td colspan=&quot;${dates.length + 1}&quot; class=&quot;px-6 py-3 font-bold text-lg text-blue-800 border-b-2 border-blue-200&quot;&gt;
                            &lt;i class=&quot;fas fa-folder-open mr-2&quot;&gt;&lt;/i&gt;${category}
                        &lt;/td&gt;
                    &lt;/tr&gt;
                `;
                rowIndex++;

                // Metrics rows for this category
                metrics.forEach((metric) =&gt; {
                    const bgClass = rowIndex % 2 === 0 ? &#x27;bg-gray-50&#x27; : &#x27;bg-white&#x27;;
                    tableHTML += `&lt;tr class=&quot;hover:bg-blue-50 transition-colors ${bgClass}&quot;&gt;
                        &lt;td class=&quot;px-6 py-4 text-sm font-semibold text-readable pl-12&quot;&gt;
                            &lt;span class=&quot;text-gray-600 mr-2&quot;&gt;└─&lt;/span&gt;${metric}
                        &lt;/td&gt;`;
                    
                    dates.forEach(date =&gt; {
                        tableHTML += &#x27;&lt;td class=&quot;px-6 py-4 text-sm&quot;&gt;&#x27;;
                        
                        selectedDataTypes.forEach((dataType, index) =&gt; {
                            const value = pivotData[date]?.[dataType]?.[metric];
                            
                            if (value !== undefined) {
                                // Calculate MOM comparison for Today data
                                let comparisonHTML = &#x27;&#x27;;
                                if (date.includes(&#x27;Today&#x27;)) {
                                    const compareValue = pivotData[&#x27;Compare MOM&#x27;]?.[dataType]?.[metric];
                                    if (compareValue !== undefined) {
                                        const change = calculatePercentageChange(value, compareValue);
                                        comparisonHTML = `&lt;div class=&quot;mt-2&quot;&gt;${createComparisonBadge(change, metric)}&lt;/div&gt;`;
                                    }
                                }

                                const cardBgClass = date.includes(&#x27;Target&#x27;) ? &#x27;bg-blue-100 border-blue-300&#x27; :
                                                  date.includes(&#x27;Compare&#x27;) ? &#x27;bg-yellow-100 border-yellow-300&#x27; :
                                                  date.includes(&#x27;Today&#x27;) ? &#x27;bg-green-100 border-green-300&#x27; :
                                                  &#x27;bg-gray-100 border-gray-300&#x27;;

                                tableHTML += `
                                    &lt;div class=&quot;metric-cell ${cardBgClass} border&quot; onclick=&quot;showMetricChart(&#x27;${metric}&#x27;, &#x27;${dataType}&#x27;)&quot;&gt;
                                        &lt;div class=&quot;metric-label&quot;&gt;${dataType}&lt;/div&gt;
                                        &lt;div class=&quot;metric-value&quot;&gt;${formatValue(value, metricsConfig[metric]?.unit || &#x27;count&#x27;)}&lt;/div&gt;
                                        ${comparisonHTML}
                                    &lt;/div&gt;
                                `;
                            }
                        });
                        tableHTML += &#x27;&lt;/td&gt;&#x27;;
                    });
                    
                    tableHTML += &#x27;&lt;/tr&gt;&#x27;;
                    rowIndex++;
                });
            });

            tableHTML += &#x27;&lt;/tbody&gt;&#x27;;
            document.getElementById(&#x27;pivotTable&#x27;).innerHTML = tableHTML;
        }

        function showMetricChart(metric, dataType) {
            if (!pivotData) return;

            const chartData = [];

            const backgroundColors = [];
            const borderColors = [];

            // Collect data for the specific metric and data type
            Object.entries(pivotData).forEach(([date, typeData]) =&gt; {
                const value = typeData[dataType]?.[metric];
                if (value !== undefined &amp;&amp; !date.includes(&#x27;Target&#x27;)) {

                    values.push(value);
