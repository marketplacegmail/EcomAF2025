                        &lt;div class=&quot;stat-label&quot;&gt;Tổng số ngày&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;stat-item&quot;&gt;
                        &lt;div class=&quot;stat-value&quot; id=&quot;totalPendingOrders&quot;&gt;0&lt;/div&gt;
                        &lt;div class=&quot;stat-label&quot;&gt;Tổng đơn chờ xử lý&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;stat-item&quot;&gt;
                        &lt;div class=&quot;stat-value&quot; id=&quot;totalReportOrders&quot;&gt;0&lt;/div&gt;
                        &lt;div class=&quot;stat-label&quot;&gt;Tổng đơn báo cáo&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;stat-item&quot;&gt;
                        &lt;div class=&quot;stat-value&quot; id=&quot;avgProcessRate&quot;&gt;0%&lt;/div&gt;
                        &lt;div class=&quot;stat-label&quot;&gt;Tỷ lệ xử lý TB&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;div class=&quot;history-controls&quot;&gt;
                    &lt;button class=&quot;toggle-history-btn&quot; onclick=&quot;toggleHistoryList()&quot;&gt;
                        &lt;span id=&quot;toggleIcon&quot;&gt;▼&lt;/span&gt;
                        &lt;span id=&quot;toggleText&quot;&gt;Hiển thị tất cả&lt;/span&gt;
                    &lt;/button&gt;
                    
                    &lt;label for=&quot;historyDate&quot;&gt;🔍 Xem ngày cụ thể:&lt;/label&gt;
                    &lt;input type=&quot;date&quot; id=&quot;historyDate&quot;&gt;
                    &lt;button onclick=&quot;viewSpecificDate()&quot;&gt;Xem chi tiết&lt;/button&gt;
                    &lt;button onclick=&quot;clearHistoryFilter()&quot; style=&quot;background: #ff9800;&quot;&gt;Xóa bộ lọc&lt;/button&gt;
                &lt;/div&gt;

                &lt;div class=&quot;history-list&quot; id=&quot;historyList&quot;&gt;
                    &lt;div class=&quot;empty-state&quot;&gt;
                        &lt;p&gt;Chưa có dữ liệu lịch sử. Lưu dữ liệu để xem lịch sử!&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- Copyright mới --&gt;
        &lt;div class=&quot;footer&quot;&gt;
            &lt;p&gt;copyright by Tien Hoang with love&lt;/p&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // Khởi tạo
        let productsDatabase = [];
        let historyVisible = false;
        
        window.onload = function() {
            setToday();
            setDefaultReportTime();
            loadProductsDatabase();
            loadHistory();
            updateStatsSummary();
        };

        function setDefaultReportTime() {
            const today = new Date();
            document.getElementById(&#x27;reportDate&#x27;).value = today.toISOString().split(&#x27;T&#x27;)[0];
            document.getElementById(&#x27;reportTime&#x27;).value = &#x27;19:30&#x27;;
        }

        function setToday() {
            const today = new Date().toISOString().split(&#x27;T&#x27;)[0];
            document.getElementById(&#x27;selectedDate&#x27;).value = today;
            loadDataForDate();
        }

        function loadProductsDatabase() {
            const saved = localStorage.getItem(&#x27;productsDatabase&#x27;);
            if (saved) {
                productsDatabase = JSON.parse(saved);
            }
        }

        function saveProductsDatabase() {
            localStorage.setItem(&#x27;productsDatabase&#x27;, JSON.stringify(productsDatabase));
        }

        function addProduct() {
            const codeInput = document.getElementById(&#x27;productCode&#x27;);
            const code = codeInput.value.trim();
            
            if (!code) {
                // Thay alert bằng thông báo showNotification
                showNotification(&#x27;❌ Vui lòng nhập mã sản phẩm!&#x27;);
                return;
            }

            if (productsDatabase.includes(code)) {
                showNotification(&#x27;ℹ️ Mã sản phẩm đã tồn tại!&#x27;);
                return;
            }

            productsDatabase.push(code);
            saveProductsDatabase();
            codeInput.value = &#x27;&#x27;;
            displayProducts();
            showNotification(&#x27;✅ Đã thêm sản phẩm: &#x27; + code);
        }

        function removeProduct(code) {
            // Thay confirm bằng custom logic hoặc mô phỏng confirm
            // Lưu ý: confirm() trên đây là cho phần Quản lý Sản phẩm, không phải Lịch sử
            if (confirm(&#x27;Bạn có chắc muốn xóa sản phẩm &#x27; + code + &#x27;?&#x27;)) {
                productsDatabase = productsDatabase.filter(p =&gt; p !== code);
                saveProductsDatabase();
                displayProducts();
                showNotification(&#x27;🗑️ Đã xóa sản phẩm: &#x27; + code);
            }
        }

        function displayProducts() {
            const listDiv = document.getElementById(&#x27;productList&#x27;);
            
            if (productsDatabase.length === 0) {
                listDiv.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;&lt;p&gt;Chưa có sản phẩm nào. Thêm mã sản phẩm để bắt đầu!&lt;/p&gt;&lt;/div&gt;&#x27;;
                return;
            }

            listDiv.innerHTML = productsDatabase.map(code =&gt; `
                &lt;div class=&quot;product-item&quot;&gt;
                    &lt;span&gt;&lt;strong&gt;${code}&lt;/strong&gt;&lt;/span&gt;
                    &lt;button onclick=&quot;removeProduct(&#x27;${code}&#x27;)&quot;&gt;Xóa&lt;/button&gt;
                &lt;/div&gt;
            `).join(&#x27;&#x27;);
        }

        function saveData() {
            const selectedDate = document.getElementById(&#x27;selectedDate&#x27;).value;
            
            if (!selectedDate) {
                showNotification(&#x27;❌ Vui lòng chọn ngày!&#x27;);
                return;
            }

            // Lấy dữ liệu mới từ Chat Info
            const chatInfo = document.getElementById(&#x27;chat-info-input&#x27;).value.trim();

            const data = {
                date: selectedDate,
                timestamp: new Date().toISOString(),
                channels: {
                    shopee: parseInt(document.getElementById(&#x27;shopee&#x27;).value) || 0,
                    lazada: parseInt(document.getElementById(&#x27;lazada&#x27;).value) || 0,
                    tiktok: parseInt(document.getElementById(&#x27;tiktok&#x27;).value) || 0,
                    tiki: parseInt(document.getElementById(&#x27;tiki&#x27;).value) || 0,
                    website: parseInt(document.getElementById(&#x27;website&#x27;).value) || 0,
                    mso: parseInt(document.getElementById(&#x27;mso&#x27;).value) || 0
                },
                products: [...productsDatabase],
                report: {
                    date: document.getElementById(&#x27;reportDate&#x27;).value || &#x27;&#x27;,
                    time: document.getElementById(&#x27;reportTime&#x27;).value || &#x27;&#x27;,
                    total: parseInt(document.getElementById(&#x27;totalOrders&#x27;).value) || 0,
                    processed: parseInt(document.getElementById(&#x27;processedOrders&#x27;).value) || 0,
                    pending: parseInt(document.getElementById(&#x27;pendingOrders&#x27;).value) || 0
                },
                // Thêm dữ liệu Chat Info
                chatInfo: chatInfo
            };

            // Lưu vào localStorage
            let history = JSON.parse(localStorage.getItem(&#x27;orderHistory&#x27;) || &#x27;{}&#x27;);
            history[selectedDate] = data;
            localStorage.setItem(&#x27;orderHistory&#x27;, JSON.stringify(history));

            showNotification(&#x27;💾 Đã lưu dữ liệu thành công!&#x27;);
            loadHistory();
            updateStatsSummary();
        }

        function loadDataForDate() {
            const selectedDate = document.getElementById(&#x27;selectedDate&#x27;).value;
            
            if (!selectedDate) {
                showNotification(&#x27;❌ Vui lòng chọn ngày!&#x27;);
                return;
            }

            const history = JSON.parse(localStorage.getItem(&#x27;orderHistory&#x27;) || &#x27;{}&#x27;);
            const data = history[selectedDate];

            if (data) {
                // Load channels data
                document.getElementById(&#x27;shopee&#x27;).value = data.channels.shopee || &#x27;&#x27;;
                document.getElementById(&#x27;lazada&#x27;).value = data.channels.lazada || &#x27;&#x27;;
                document.getElementById(&#x27;tiktok&#x27;).value = data.channels.tiktok || &#x27;&#x27;;
                document.getElementById(&#x27;tiki&#x27;).value = data.channels.tiki || &#x27;&#x27;;
                document.getElementById(&#x27;website&#x27;).value = data.channels.website || &#x27;&#x27;;
                document.getElementById(&#x27;mso&#x27;).value = data.channels.mso || &#x27;&#x27;;

                // Load report data
                document.getElementById(&#x27;reportDate&#x27;).value = data.report.date || &#x27;&#x27;;
                document.getElementById(&#x27;reportTime&#x27;).value = data.report.time || &#x27;&#x27;;
                document.getElementById(&#x27;totalOrders&#x27;).value = data.report.total || &#x27;&#x27;;
                document.getElementById(&#x27;processedOrders&#x27;).value = data.report.processed || &#x27;&#x27;;
                document.getElementById(&#x27;pendingOrders&#x27;).value = data.report.pending || &#x27;&#x27;;

                // Load Chat Info
                document.getElementById(&#x27;chat-info-input&#x27;).value = data.chatInfo || &#x27;&#x27;;

                showNotification(&#x27;📂 Đã tải dữ liệu ngày &#x27; + formatDate(selectedDate));
            } else {
                // Clear all fields
                clearAllFields();
                showNotification(&#x27;ℹ️ Chưa có dữ liệu cho ngày &#x27; + formatDate(selectedDate));
            }
        }

        function clearAllFields() {
            document.getElementById(&#x27;shopee&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;lazada&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;tiktok&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;tiki&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;website&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;mso&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;chat-info-input&#x27;).value = &#x27;&#x27;; // Clear chat info field
            setDefaultReportTime();
            document.getElementById(&#x27;totalOrders&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;processedOrders&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;pendingOrders&#x27;).value = &#x27;&#x27;;
        }

        function toggleHistoryList() {
            const historyList = document.getElementById(&#x27;historyList&#x27;);
            const toggleIcon = document.getElementById(&#x27;toggleIcon&#x27;);
            const toggleText = document.getElementById(&#x27;toggleText&#x27;);
            
            historyVisible = !historyVisible;
            
            if (historyVisible) {
                historyList.classList.add(&#x27;show&#x27;);
                toggleIcon.textContent = &#x27;▲&#x27;;
                toggleText.textContent = &#x27;Ẩn tất cả&#x27;;
                // Clear any specific date filter
                document.getElementById(&#x27;historyDate&#x27;).value = &#x27;&#x27;;
                loadHistory();
            } else {
                historyList.classList.remove(&#x27;show&#x27;);
                toggleIcon.textContent = &#x27;▼&#x27;;
                toggleText.textContent = &#x27;Hiển thị tất cả&#x27;;
            }
        }

        function viewSpecificDate() {
            const specificDate = document.getElementById(&#x27;historyDate&#x27;).value;
            
            if (!specificDate) {
                showNotification(&#x27;❌ Vui lòng chọn ngày để xem!&#x27;);
                return;
            }

            const history = JSON.parse(localStorage.getItem(&#x27;orderHistory&#x27;) || &#x27;{}&#x27;);
            const historyList = document.getElementById(&#x27;historyList&#x27;);
            
            if (!history[specificDate]) {
                historyList.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;&lt;p&gt;Không có dữ liệu cho ngày &#x27; + formatDate(specificDate) + &#x27;&lt;/p&gt;&lt;/div&gt;&#x27;;
                historyList.classList.add(&#x27;show&#x27;);
                historyVisible = true;
                document.getElementById(&#x27;toggleIcon&#x27;).textContent = &#x27;▲&#x27;;
                document.getElementById(&#x27;toggleText&#x27;).textContent = &#x27;Ẩn tất cả&#x27;;
                return;
            }

            // Display only the specific date
            displayHistoryItems([specificDate], history);
            historyList.classList.add(&#x27;show&#x27;);
            historyVisible = true;
            document.getElementById(&#x27;toggleIcon&#x27;).textContent = &#x27;▲&#x27;;
            document.getElementById(&#x27;toggleText&#x27;).textContent = &#x27;Ẩn tất cả&#x27;;
        }

        function clearHistoryFilter() {
            document.getElementById(&#x27;historyDate&#x27;).value = &#x27;&#x27;;
            loadHistory();
            if (historyVisible) {
                document.getElementById(&#x27;historyList&#x27;).classList.add(&#x27;show&#x27;);
            }
            showNotification(&#x27;🔄 Đã xóa bộ lọc&#x27;);
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem(&#x27;orderHistory&#x27;) || &#x27;{}&#x27;);
            const historyList = document.getElementById(&#x27;historyList&#x27;);
            const dates = Object.keys(history).sort().reverse();

            if (dates.length === 0) {
                historyList.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;&lt;p&gt;Chưa có dữ liệu lịch sử. Lưu dữ liệu để xem lịch sử!&lt;/p&gt;&lt;/div&gt;&#x27;;
                return;
            }

            displayHistoryItems(dates, history);
            displayProducts();
        }

        function displayHistoryItems(dates, history) {
            const historyList = document.getElementById(&#x27;historyList&#x27;);
            
            historyList.innerHTML = dates.map(date =&gt; {
                const data = history[date];
                const totalChannels = Object.values(data.channels).reduce((a, b) =&gt; a + b, 0);
                
                const reportDateTime = data.report.date &amp;&amp; data.report.time ? 
                    `📅 ${formatDate(data.report.date)} ⏰ ${data.report.time}` : 
                    &#x27;Chưa cập nhật&#x27;;
                
                const processRate = data.report.total &gt; 0 ? 
                    ((data.report.processed / data.report.total) * 100).toFixed(1) : &#x27;0&#x27;;
                
                const chatInfoText = data.chatInfo ? data.chatInfo : &#x27;Không có thông tin chat.&#x27;;

                return `
                    &lt;div class=&quot;history-item&quot;&gt;
                        &lt;div class=&quot;history-date&quot;&gt;📅 ${formatDate(date)}&lt;/div&gt;
                        &lt;div class=&quot;history-summary&quot;&gt;
                            &lt;div&gt;&lt;strong&gt;Tổng đơn chờ:&lt;/strong&gt; ${totalChannels}&lt;/div&gt;
                            &lt;div&gt;&lt;strong&gt;Tổng đơn đổi:&lt;/strong&gt; ${data.report.total}&lt;/div&gt;
                            &lt;div&gt;&lt;strong&gt;Đã xử lý:&lt;/strong&gt; ${data.report.processed}&lt;/div&gt;
                            &lt;div&gt;&lt;strong&gt;Chưa xử lý:&lt;/strong&gt; ${data.report.pending}&lt;/div&gt;
                            &lt;div&gt;&lt;strong&gt;Tỷ lệ xử lý:&lt;/strong&gt; ${processRate}%&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;history-detail&quot;&gt;
                            &lt;h4&gt;📦 Chi tiết đơn hàng theo kênh:&lt;/h4&gt;
                            &lt;div class=&quot;history-detail-grid&quot;&gt;
                                &lt;div&gt;&lt;strong&gt;🧡 Shopee:&lt;/strong&gt; ${data.channels.shopee}&lt;/div&gt;
                                &lt;div&gt;&lt;strong&gt;💙 Lazada:&lt;/strong&gt; ${data.channels.lazada}&lt;/div&gt;
                                &lt;div&gt;&lt;strong&gt;🎶 TikTok:&lt;/strong&gt; ${data.channels.tiktok}&lt;/div&gt;
                                &lt;div&gt;&lt;strong&gt;🛒 Tiki:&lt;/strong&gt; ${data.channels.tiki}&lt;/div&gt;
                                &lt;div&gt;&lt;strong&gt;🌐 Website:&lt;/strong&gt; ${data.channels.website}&lt;/div&gt;
                                &lt;div&gt;&lt;strong&gt;🫂 MSO:&lt;/strong&gt; ${data.channels.mso}&lt;/div&gt;
                            &lt;/div&gt;
                            &lt;div style=&quot;margin-top: 15px;&quot;&gt;
                                &lt;h4&gt;💬 Thông tin Chat:&lt;/h4&gt;
                                &lt;p style=&quot;white-space: pre-wrap; font-size: 0.9em; color: #555;&quot;&gt;${chatInfoText}&lt;/p&gt;
                            &lt;/div&gt;
                            &lt;div style=&quot;margin-top: 15px;&quot;&gt;
                                &lt;strong&gt;⏰ Thời gian báo cáo:&lt;/strong&gt; ${reportDateTime}
                            &lt;/div&gt;
                            &lt;div style=&quot;margin-top: 10px; display: flex; gap: 10px;&quot;&gt;
                                &lt;button onclick=&quot;loadHistoryDate(&#x27;${date}&#x27;)&quot; style=&quot;padding: 8px 15px; background: #4facfe; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: Arial, sans-serif;&quot;&gt;
                                    📝 Chỉnh sửa
                                &lt;/button&gt;
                                &lt;button onclick=&quot;deleteHistoryDate(&#x27;${date}&#x27;)&quot; style=&quot;padding: 8px 15px; background: #ff4757; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: Arial, sans-serif;&quot;&gt;
                                    🗑️ Xóa
                                &lt;/button&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
            }).join(&#x27;&#x27;);
        }

        function loadHistoryDate(date) {
            document.getElementById(&#x27;selectedDate&#x27;).value = date;
            loadDataForDate();
            window.scrollTo({ top: 0, behavior: &#x27;smooth&#x27; });
        }

        function deleteHistoryDate(date) {
            // Đã loại bỏ confirm() để nút hoạt động trong iFrame.
            let history = JSON.parse(localStorage.getItem(&#x27;orderHistory&#x27;) || &#x27;{}&#x27;);
            
            if (history[date]) {
                delete history[date];
                localStorage.setItem(&#x27;orderHistory&#x27;, JSON.stringify(history));
                loadHistory();
                updateStatsSummary();
                showNotification(&#x27;🗑️ Đã xóa dữ liệu ngày &#x27; + formatDate(date));
            } else {
                showNotification(&#x27;❌ Không tìm thấy dữ liệu để xóa.&#x27;);
            }
        }

        function updateStatsSummary() {
            const history = JSON.parse(localStorage.getItem(&#x27;orderHistory&#x27;) || &#x27;{}&#x27;);
            const dates = Object.keys(history);
            
            if (dates.length === 0) {
                document.getElementById(&#x27;statsSummary&#x27;).style.display = &#x27;none&#x27;;
                return;
            }

            document.getElementById(&#x27;statsSummary&#x27;).style.display = &#x27;grid&#x27;;

            let totalPending = 0;
            let totalReport = 0;
            let totalProcessed = 0;

            dates.forEach(date =&gt; {
                const data = history[date];
                totalPending += Object.values(data.channels).reduce((a, b) =&gt; a + b, 0);
                totalReport += data.report.total;
                totalProcessed += data.report.processed;
            });

            const avgProcessRate = totalReport &gt; 0 ? 
                ((totalProcessed / totalReport) * 100).toFixed(1) : &#x27;0&#x27;;

            document.getElementById(&#x27;totalDays&#x27;).textContent = dates.length;
            document.getElementById(&#x27;totalPendingOrders&#x27;).textContent = totalPending;
            document.getElementById(&#x27;totalReportOrders&#x27;).textContent = totalReport;
            document.getElementById(&#x27;avgProcessRate&#x27;).textContent = avgProcessRate + &#x27;%&#x27;;
        }

        function formatDate(dateString) {
            const date = new Date(dateString + &#x27;T00:00:00&#x27;);
            const days = [&#x27;Chủ Nhật&#x27;, &#x27;Thứ Hai&#x27;, &#x27;Thứ Ba&#x27;, &#x27;Thứ Tư&#x27;, &#x27;Thứ Năm&#x27;, &#x27;Thứ Sáu&#x27;, &#x27;Thứ Bảy&#x27;];
            return `${days[date.getDay()]}, ${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
        }

        function showNotification(message) {
            const notification = document.createElement(&#x27;div&#x27;);
            notification.className = &#x27;notification&#x27;;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() =&gt; {
                notification.remove();
            }, 3000);
        }

        function exportToExcel() {
            const history = JSON.parse(localStorage.getItem(&#x27;orderHistory&#x27;) || &#x27;{}&#x27;);
            const dates = Object.keys(history).sort();

            if (dates.length === 0) {
                showNotification(&#x27;❌ Chưa có dữ liệu để xuất!&#x27;);
                return;
            }

            // Tạo workbook với BOM UTF-8 cho Excel
            let csvContent = &#x27;\ufeff&#x27;;

            // Sheet 1: Tổng quan đơn hàng chờ xử lý
            csvContent += &#x27;=== TỔNG QUAN ĐƠN HÀNG CHỜ XỬ LÝ ===\n\n&#x27;;
            csvContent += &#x27;Ngày,Shopee,Lazada,TikTok,Tiki,Website,MSO,Tổng Cộng\n&#x27;;
            
            dates.forEach(date =&gt; {
                const data = history[date];
                const channels = data.channels;
                const total = Object.values(channels).reduce((a, b) =&gt; a + b, 0);
                csvContent += `${formatDateShort(date)},${channels.shopee},${channels.lazada},${channels.tiktok},${channels.tiki},${channels.website},${channels.mso},${total}\n`;
            });

            // Tính tổng cộng
            const totals = {
                shopee: 0,
                lazada: 0,
                tiktok: 0,
                tiki: 0,
                website: 0,
                mso: 0
            };

            dates.forEach(date =&gt; {
                const channels = history[date].channels;
                Object.keys(totals).forEach(key =&gt; {
                    totals[key] += channels[key];
                });
            });

            const grandTotal = Object.values(totals).reduce((a, b) =&gt; a + b, 0);
            csvContent += `TỔNG CỘNG,${totals.shopee},${totals.lazada},${totals.tiktok},${totals.tiki},${totals.website},${totals.mso},${grandTotal}\n`;

            // Sheet 2: Báo cáo đơn đổi
            csvContent += &#x27;\n\n=== BÁO CÁO ĐƠN ĐỔI ===\n\n&#x27;;
            csvContent += &#x27;Ngày,Thời Gian Báo Cáo,Tổng Số Đơn,Đã Xử Lý,Chưa Xử Lý,Tỷ Lệ Xử Lý (%)\n&#x27;;
            
            dates.forEach(date =&gt; {
                const data = history[date];
                const report = data.report;
                const reportDateTime = report.date &amp;&amp; report.time ? 
                    `${formatDateShort(report.date)} ${report.time}` : 
                    &#x27;Chưa cập nhật&#x27;;
                const processRate = report.total &gt; 0 ? 
                    ((report.processed / report.total) * 100).toFixed(1) : &#x27;0&#x27;;
                
                csvContent += `${formatDateShort(date)},${reportDateTime},${report.total},${report.processed},${report.pending},${processRate}%\n`;
            });

            // Tính tổng báo cáo
            let totalReportOrders = 0;
            let totalProcessed = 0;
            let totalPending = 0;

            dates.forEach(date =&gt; {
                const report = history[date].report;
                totalReportOrders += report.total;
                totalProcessed += report.processed;
                totalPending += report.pending;
            });

            const avgProcessRate = totalReportOrders &gt; 0 ? 
                ((totalProcessed / totalReportOrders) * 100).toFixed(1) : &#x27;0&#x27;;

            csvContent += `TỔNG CỘNG,,${totalReportOrders},${totalProcessed},${totalPending},${avgProcessRate}%\n`;

            // Sheet 3: Danh sách sản phẩm
            csvContent += &#x27;\n\n=== DANH SÁCH SẢN PHẨM ===\n\n&#x27;;
            csvContent += &#x27;STT,Mã Sản Phẩm\n&#x27;;
            
            productsDatabase.forEach((product, index) =&gt; {
                csvContent += `${index + 1},${product}\n`;
            });

            // Sheet 4: Thông tin Chat
            csvContent += &#x27;\n\n=== THÔNG TIN CHAT ===\n\n&#x27;;
            csvContent += &#x27;Ngày,Nội Dung Khách Hỏi Nhiều Nhất\n&#x27;;
            
            dates.forEach(date =&gt; {
                const data = history[date];
                const chatInfo = data.chatInfo ? data.chatInfo.replace(/\n/g, &#x27; | &#x27;) : &#x27;&#x27;; // Thay thế xuống dòng bằng | cho CSV
                csvContent += `${formatDateShort(date)},&quot;${chatInfo}&quot;\n`;
            });

            // Sheet 5: Phân tích theo kênh
            csvContent += &#x27;\n\n=== PHÂN TÍCH THEO KÊNH ===\n\n&#x27;;
            csvContent += &#x27;Kênh,Tổng Đơn,Trung Bình/Ngày,Tỷ Lệ (%)\n&#x27;;
            
            const channels = [&#x27;Shopee&#x27;, &#x27;Lazada&#x27;, &#x27;TikTok&#x27;, &#x27;Tiki&#x27;, &#x27;Website&#x27;, &#x27;MSO&#x27;];
            const channelKeys = [&#x27;shopee&#x27;, &#x27;lazada&#x27;, &#x27;tiktok&#x27;, &#x27;tiki&#x27;, &#x27;website&#x27;, &#x27;mso&#x27;];
            
            channelKeys.forEach((key, index) =&gt; {
                const total = totals[key];
                const avg = (total / dates.length).toFixed(1);
                const percentage = ((total / grandTotal) * 100).toFixed(1);
                csvContent += `${channels[index]},${total},${avg},${percentage}%\n`;
            });

            // Sheet 6: Chi tiết theo ngày
            csvContent += &#x27;\n\n=== CHI TIẾT THEO NGÀY ===\n\n&#x27;;
            
            dates.forEach(date =&gt; {
                const data = history[date];
                csvContent += `\n--- ${formatDateShort(date)} ---\n`;
                csvContent += &#x27;Đơn Hàng Chờ Xử Lý:\n&#x27;;
                csvContent += `  Shopee: ${data.channels.shopee}\n`;
                csvContent += `  Lazada: ${data.channels.lazada}\n`;
                csvContent += `  TikTok: ${data.channels.tiktok}\n`;
                csvContent += `  Tiki: ${data.channels.tiki}\n`;
                csvContent += `  Website: ${data.channels.website}\n`;
                csvContent += `  MSO: ${data.channels.mso}\n`;
                
                const reportDateTime = data.report.date &amp;&amp; data.report.time ? 
                    `${formatDateShort(data.report.date)} ${data.report.time}` : 
                    &#x27;Chưa cập nhật&#x27;;
                
                csvContent += `\nBáo Cáo Đơn Đổi (${reportDateTime}):\n`;
                csvContent += `  Tổng số đơn: ${data.report.total}\n`;
                csvContent += `  Đã xử lý: ${data.report.processed}\n`;
                csvContent += `  Chưa xử lý: ${data.report.pending}\n`;

                csvContent += `\nThông Tin Chat:\n`;
                csvContent += `  Nội dung: ${data.chatInfo || &#x27;Không có&#x27;}\n`;
            });

            // Tạo file và download
            const blob = new Blob([csvContent], { type: &#x27;text/csv;charset=utf-8;&#x27; });
            const link = document.createElement(&#x27;a&#x27;);
            const url = URL.createObjectURL(blob);
            
            const today = new Date();
            const filename = `ECommerce_Operation_Report_${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, &#x27;0&#x27;)}-${String(today.getDate()).padStart(2, &#x27;0&#x27;)}.csv`;
            
            link.setAttribute(&#x27;href&#x27;, url);
            link.setAttribute(&#x27;download&#x27;, filename);
            link.style.visibility = &#x27;hidden&#x27;;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showNotification(&#x27;📥 Đã tải xuống file Excel: &#x27; + filename);
        }

        function formatDateShort(dateString) {
            const date = new Date(dateString + &#x27;T00:00:00&#x27;);
            return `${String(date.getDate()).padStart(2, &#x27;0&#x27;)}/${String(date.getMonth() + 1).padStart(2, &#x27;0&#x27;)}/${date.getFullYear()}`;
        }
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
    </div>
    <script>
        // ============================================================
        //  Tab switching
        // ============================================================
        const buttons = document.querySelectorAll('.tab-btn');
        const frames = document.querySelectorAll('.file-frame');
        let currentTab = null;

        function activateTab(targetId) {
            buttons.forEach(b => b.classList.remove('active'));
            frames.forEach(f => f.classList.remove('active'));
            const targetFrame = document.getElementById(targetId);
            const targetBtn = document.querySelector(`.tab-btn[data-target="${targetId}"]`);
            if (targetFrame) targetFrame.classList.add('active');
            if (targetBtn) targetBtn.classList.add('active');
            currentTab = targetId;
        }

        buttons.forEach((btn) => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.target;
                if (target) activateTab(target);
            });
        });

        if (buttons.length > 0 && frames.length > 0) {
            activateTab(buttons[0].dataset.target);
        }

        // ============================================================
        //  AUTO-SAVE + RESTORE OUTPUT
        //  - Lưu draft khi gõ/chỉnh
        //  - Khôi phục lại cả phần nội dung đã generate sau khi F5
        //  - Áp dụng cho File 2, 3, 4, 5b và File 7
        // ============================================================
        const AUTOSAVE_TARGETS = {
            file1:  { key: 'ibasic_autosave_file1',  label: 'Livestream Dashboard' },
            file2:  { key: 'ibasic_autosave_file2',  label: 'Livestream Script Gen' },
            file3:  { key: 'ibasic_autosave_file3',  label: 'Underwear Storytelling' },
            file4:  { key: 'ibasic_autosave_file4',  label: 'Lingerie Descriptions' },
            file5:  { key: 'ibasic_autosave_file5',  label: 'Smooth Thumbnail Maker' },
            file5a: { key: 'ibasic_autosave_file5a', label: 'Thumbnail Setting' },
            file5b: { key: 'ibasic_autosave_file5b', label: 'InfoiBasic V6' },
            file6:  { key: 'ibasic_autosave_file6',  label: 'Enhanced Dashboard Fixed' },
            file7:  { key: 'ibasic_autosave_file7',  label: 'Ecommerce Operation' }
        };

        const EXTRA_SELECTORS = {
            file2: ['#script1', '#script2', '#scriptTabs', '#errorMessage'],
            file3: ['#storyOutput', '#copyButton'],
            file4: ['#descriptionContent', '#resultPanel'],
            file5b: ['#resArea', '#panelMarketing', '#panelMota'],
            file7: ['#historyList']
        };

        // Cờ "đang restore" — ngăn scheduleSave đè mất dữ liệu
        const isRestoring = {};

        // API key field IDs (sau đây được PHÉP lưu để tiện làm việc — lưu trên trình duyệt này)
        const API_KEY_IDS = new Set(['apiKey', 'apiKeyInp', 'apiKeyInput', 'gemini_api_key', 'apikey']);

        const SKIP_ID_PATTERNS = [/loader/i, /loading/i, /msgbox/i, /msgtext/i, /preview/i, /thumb/i, /dropzone/i, /uploadarea/i];
        const SKIP_TYPES = ['file','button','submit','reset','image']; // KHÔNG skip password — để lưu API key

        const toastEl = document.getElementById('autosaveToast');
        let toastTimer = null;
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
        }

        function shouldSkip(el) {
            if (!el) return true;
            if (SKIP_TYPES.includes((el.type || '').toLowerCase())) return true;
            const id = el.id || '';
            // API key fields — KHÔNG bỏ qua (cho phép lưu để user không phải nhập lại)
            if (id && API_KEY_IDS.has(id)) return false;
            if (id && SKIP_ID_PATTERNS.some(rx => rx.test(id))) return true;
            // Hidden field nói chung bỏ qua, trừ khi có id liên quan API key
            if ((el.type || '').toLowerCase() === 'hidden') return true;
            return false;
        }

        function getKeyOf(el) {
            if (el.id) return '#' + el.id;
            if (el.name) return '@' + el.name;
            let path = '';
            let n = el;
            while (n && n.nodeType === 1 && n.tagName.toLowerCase() !== 'body') {
                const siblings = Array.from(n.parentNode ? n.parentNode.children : []).filter(c => c.tagName === n.tagName);
                const idx = siblings.indexOf(n);
                path = '/' + n.tagName.toLowerCase() + '[' + idx + ']' + path;
                n = n.parentNode;
            }
            return '$' + path;
        }

        function readValue(el) {
            if (el.type === 'checkbox' || el.type === 'radio') return !!el.checked;
            return el.value;
        }

        function writeValue(el, v, silent) {
            try {
                if (el.type === 'checkbox' || el.type === 'radio') {
                    el.checked = !!v;
                } else {
                    el.value = (v == null ? '' : v);
                }
                if (!silent) {
                    el.dispatchEvent(new Event('input',  { bubbles: true }));
                    el.dispatchEvent(new Event('change', { bubbles: true }));
                }
            } catch (e) {}
        }

        function collectFields(doc) {
            return Array.from(doc.querySelectorAll('input, textarea, select')).filter(el => !shouldSkip(el));
        }

        function collectExtraState(doc, iframeId) {
            const selectors = EXTRA_SELECTORS[iframeId] || [];
            const out = {};
            selectors.forEach(sel => {
                const el = doc.querySelector(sel);
                if (!el) return;
                out[sel] = {
                    innerHTML: el.innerHTML,
                    value: typeof el.value !== 'undefined' ? el.value : null,
                    className: el.className || '',
                    style: el.getAttribute('style') || ''
                };
            });

            if (iframeId === 'file2') {
                const activeBtn = doc.querySelector('.script-tabs .tab-btn.active');
                const activeOutput = doc.querySelector('.script-output.active');
                out.__file2 = {
                    activeTabText: activeBtn ? activeBtn.textContent.trim() : '',
                    activeOutputId: activeOutput ? activeOutput.id : ''
                };
            }

            if (iframeId === 'file5b') {
                const activePanel = doc.querySelector('.panel.active');
                out.__file5b = {
                    activePanelId: activePanel ? activePanel.id : ''
                };
            }

            return out;
        }

        function restoreExtraState(doc, iframeId, extras) {
            if (!extras || typeof extras !== 'object') return;
            Object.keys(extras).forEach(sel => {
                if (sel.startsWith('__')) return;
                const state = extras[sel];
                const el = doc.querySelector(sel);
                if (!el || !state) return;
                if (state.className != null) el.className = state.className;
                if (state.style != null) el.setAttribute('style', state.style);
                if (state.innerHTML != null) el.innerHTML = state.innerHTML;
                if (typeof el.value !== 'undefined' && state.value != null) el.value = state.value;
            });

            if (iframeId === 'file2' && extras.__file2 && extras.__file2.activeOutputId) {
                doc.querySelectorAll('.script-output').forEach(el => el.classList.remove('active'));
                const target = doc.getElementById(extras.__file2.activeOutputId);
                if (target) target.classList.add('active');
                const btns = doc.querySelectorAll('.script-tabs .tab-btn');
                btns.forEach(btn => btn.classList.remove('active'));
                const idx = extras.__file2.activeOutputId === 'script2' ? 1 : 0;
                if (btns[idx]) btns[idx].classList.add('active');
            }

            if (iframeId === 'file5b' && extras.__file5b && extras.__file5b.activePanelId) {
                doc.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
                const panel = doc.getElementById(extras.__file5b.activePanelId);
                if (panel) panel.classList.add('active');
            }
        }

        function saveFrame(iframeId, silent = false) {
            const meta = AUTOSAVE_TARGETS[iframeId];
            if (!meta) return;
            const iframe = document.getElementById(iframeId);
            if (!iframe) return;
            let doc;
            try { doc = iframe.contentDocument; } catch (e) { return; }
            if (!doc) return;

            const data = {};
            collectFields(doc).forEach(el => {
                const k = getKeyOf(el);
                if (el.type === 'radio') {
                    if (el.checked) data['@radio:' + (el.name || k)] = el.value;
                } else {
                    data[k] = readValue(el);
                }
            });

            doc.querySelectorAll('.style-option.selected, .selected[data-style]').forEach((el) => {
                if (el.dataset && el.dataset.style) data['ui:selectedStyle'] = el.dataset.style;
            });

            data.__extras = collectExtraState(doc, iframeId);
            data.__savedAt = new Date().toISOString();

            try {
                localStorage.setItem(meta.key, JSON.stringify(data));
                if (!silent) showToast('💾 Đã lưu tự động (' + meta.label + ')');
            } catch (e) {}
        }

        function restoreFrame(iframeId, opts) {
            opts = opts || {};
            const meta = AUTOSAVE_TARGETS[iframeId];
            if (!meta) return false;
            const iframe = document.getElementById(iframeId);
            if (!iframe) return false;
            let doc;
            try { doc = iframe.contentDocument; } catch (e) { return false; }
            if (!doc || !doc.body) return false;

            let raw;
            try { raw = localStorage.getItem(meta.key); } catch (e) { raw = null; }
            if (!raw) return false;

            let data;
            try { data = JSON.parse(raw); } catch (e) { return false; }
            if (!data || typeof data !== 'object') return false;

            // Bật cờ restore để chặn auto-save đè dữ liệu
            isRestoring[iframeId] = true;

            try {
                collectFields(doc).forEach(el => {
                    const k = getKeyOf(el);
                    if (el.type === 'radio') {
                        const v = data['@radio:' + (el.name || k)];
                        if (v != null && el.value === v) writeValue(el, true, true);
                    } else if (Object.prototype.hasOwnProperty.call(data, k)) {
                        writeValue(el, data[k], true);
                    }
                });

                if (data['ui:selectedStyle']) {
                    doc.querySelectorAll('.style-option').forEach(o => o.classList.remove('selected'));
                    const opt = doc.querySelector('.style-option[data-style="' + data['ui:selectedStyle'] + '"]');
                    if (opt) opt.classList.add('selected');
                }

                restoreExtraState(doc, iframeId, data.__extras);

                // Đồng bộ các biến JS nội bộ của iframe sau khi restore output
                syncInternalState(iframeId, doc, data);

                if (!opts.silent) {
                    showToast('📂 Đã khôi phục dữ liệu (' + meta.label + ')');
                }
            } finally {
                // Tắt cờ sau 1 tick để các trigger phát sinh đã chạy hết
                setTimeout(() => { isRestoring[iframeId] = false; }, 200);
            }
            return true;
        }

        // Đồng bộ các biến JS cụ thể của từng tool (vd: generatedStoryContent)
        function syncInternalState(iframeId, doc, data) {
            try {
                const win = doc.defaultView;
                if (!win) return;

                // -- Đồng bộ API key sang localStorage của iframe + gộ bộ nhớ mã hoá (file 3) --
                try {
                    const apiKeyVal = data['#apiKey'] || data['#apiKeyInp'] || data['#apiKeyInput'] || '';
                    if (apiKeyVal && typeof apiKeyVal === 'string') {
                        // Ghi vào localStorage của iframe để các đoạn code kiểu localStorage.getItem('gemini_api_key') vẫn chạy
                        try { win.localStorage.setItem('gemini_api_key', apiKeyVal); } catch(e) {}
                        try { win.localStorage.setItem('ibasic_key', apiKeyVal); } catch(e) {}
                        // Nếu file 3 dùng encryptApiKey() với biến nội bộ, ta set luôn biến đó
                        try { if (typeof win.encryptApiKey === 'function') win.encryptApiKey(apiKeyVal); } catch(e) {}
                    }
                } catch (e) {}

                if (iframeId === 'file3') {
                    // File 3: cần gán lại generatedStoryContent từ DOM để nút Copy hoạt động
                    const out = doc.getElementById('storyOutput');
                    if (out) {
                        const text = (out.innerText || out.textContent || '').trim();
                        if (text && text.length > 20) {
                            try { win.generatedStoryContent = text; } catch(e) {}
                            // hiện lại nút copy
                            const btn = doc.getElementById('copyButton');
                            if (btn) btn.classList.remove('hidden');
                        }
                    }
                }

                if (iframeId === 'file2') {
                    // File 2: đồng bộ scriptData và hiện nút copy/download nếu có script
                    const s1 = doc.getElementById('script1');
                    const s2 = doc.getElementById('script2');
                    const t1 = s1 ? (s1.innerText || '').trim() : '';
                    const t2 = s2 ? (s2.innerText || '').trim() : '';
                    if (t1 || t2) {
                        try {
                            if (win.scriptData) {
                                win.scriptData.script1 = s1 ? s1.innerHTML : '';
                                win.scriptData.script2 = s2 ? s2.innerHTML : '';
                            }
                        } catch(e) {}
                        const copyBtn = doc.getElementById('copyBtn');
                        const dlBtn = doc.getElementById('downloadBtn');
                        if (copyBtn) copyBtn.disabled = false;
                        if (dlBtn) dlBtn.disabled = false;
                        const tabs = doc.getElementById('scriptTabs');
                        if (tabs && t2) tabs.style.display = '';
                    }
                }
            } catch (e) { /* cross-origin safe */ }
        }

        const saveTimers = {};
        function scheduleSave(iframeId) {
            if (isRestoring[iframeId]) return; // KHÔNG save khi đang restore
            clearTimeout(saveTimers[iframeId]);
            saveTimers[iframeId] = setTimeout(() => {
                if (isRestoring[iframeId]) return;
                saveFrame(iframeId);
            }, 400);
        }

        function attachAutosave(iframeId) {
            const iframe = document.getElementById(iframeId);
            if (!iframe) return;
            let doc;
            try { doc = iframe.contentDocument; } catch (e) { return; }
            if (!doc) return;

            // Restore nhiều lần để chống bị code init của iframe ghi đè
            const tryRestore = (silent) => restoreFrame(iframeId, { silent: !!silent });
            const ok1 = tryRestore(false);
            setTimeout(() => tryRestore(true), 300);
            setTimeout(() => tryRestore(true), 1200);
            setTimeout(() => tryRestore(true), 2500);

            const handler = (e) => {
                const t = e.target;
                if (!t) return;
                if (['INPUT','TEXTAREA','SELECT'].includes(t.tagName) && !shouldSkip(t)) {
                    scheduleSave(iframeId);
                }
            };
            doc.addEventListener('input', handler, true);
            doc.addEventListener('change', handler, true);
            doc.addEventListener('click', (e) => {
                if (e.target.closest && (e.target.closest('.style-option') || e.target.closest('button') || e.target.closest('.panel-tab') || e.target.closest('.tab-btn'))) {
                    scheduleSave(iframeId);
                }
            }, true);

            window.addEventListener('beforeunload', () => saveFrame(iframeId, true));
        }

        Object.keys(AUTOSAVE_TARGETS).forEach(id => {
            const iframe = document.getElementById(id);
            if (!iframe) return;
            if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                attachAutosave(id);
            } else {
                iframe.addEventListener('load', () => attachAutosave(id));
            }
        });

        document.getElementById('clearCurrentAutosave').addEventListener('click', () => {
            const meta = AUTOSAVE_TARGETS[currentTab];
            if (!meta) {
                showToast('ℹ️ Tab này không dùng auto-save');
                return;
            }
            if (!confirm('Xoá toàn bộ dữ liệu auto-save của "' + meta.label + '"?\nThao tác này không thể hoàn tác.')) return;
            try { localStorage.removeItem(meta.key); } catch (e) {}
            const iframe = document.getElementById(currentTab);
            if (iframe) {
                const src = iframe.getAttribute('srcdoc');
                iframe.removeAttribute('srcdoc');
                iframe.setAttribute('srcdoc', src);
            }
            showToast('🗑️ Đã xoá dữ liệu (' + meta.label + ')');
        });

        // ============================================================
        //  HISTORY CENTER  —  Lưu nhiều phiên (snapshot) cho từng tool
        // ============================================================
        const HC_KEY = 'ibasic_history_center_v2';
        const HC_LAST_KEY = 'ibasic_history_last_session';
        const HC_MAX_PER_TOOL = 30; // giới hạn số snapshot mỗi tool

        function hcLoadAll() {
            try {
                const raw = localStorage.getItem(HC_KEY);
                if (!raw) return {};
                const obj = JSON.parse(raw);
                return obj && typeof obj === 'object' ? obj : {};
            } catch (e) { return {}; }
        }
        function hcSaveAll(all) {
            try { localStorage.setItem(HC_KEY, JSON.stringify(all)); } catch (e) {
                showToast('⚠️ Lưu trữ đầy — hãy xoá bớt phiên cũ');
            }
        }

        function hcGenId() {
            return 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        }

        // Sinh tiêu đề gợi ý cho snapshot dựa vào các field chính
        function hcGuessTitle(iframeId, fields) {
            const pick = (ids) => {
                for (const id of ids) {
                    const v = fields['#' + id];
                    if (v && String(v).trim()) return String(v).trim().slice(0, 80);
                }
                return '';
            };
            if (iframeId === 'file1') return pick(['date','product','sku']) || 'Phiên Livestream Dashboard';
            if (iframeId === 'file2') return pick(['topic','product1','brandStory']) || 'Phiên Livestream Script';
            if (iframeId === 'file3') return pick(['keywordInput','topicSelect']) || 'Phiên Storytelling';
            if (iframeId === 'file4') return pick(['productName','productType','color']) || 'Phiên Lô mô tả';
            if (iframeId === 'file5') return pick(['productName','title','heading']) || 'Phiên Thumbnail Maker';
            if (iframeId === 'file5a') return pick(['title','heading','productName']) || 'Phiên Thumbnail Setting';
            if (iframeId === 'file5b') return pick(['mc-prod-code','mc-b2-title-txt','mc-hero-line1']) || 'Phiên InfoiBasic V6';
            if (iframeId === 'file6') return pick(['date','dateInput','reportDate']) || 'Phiên Enhanced Dashboard';
            if (iframeId === 'file7') return pick(['selectedDate','chat-info-input']) || 'Phiên Ecommerce Operation';
            return 'Phiên làm việc';
        }

        // Sinh preview ngắn
        function hcGuessPreview(iframeId, fields) {
            const parts = [];
            Object.keys(fields).slice(0, 6).forEach(k => {
                const v = fields[k];
                if (v && typeof v === 'string' && v.trim()) {
                    const name = k.replace(/^[#@$]/, '');
                    parts.push(name + ': ' + v.trim().slice(0, 40));
                }
            });
            return parts.join(' • ');
        }

        // Snapshot từ iframe (tham chiếu logic của saveFrame, có mở rộng)
        function hcSnapshot(iframeId, customTitle) {
            const meta = AUTOSAVE_TARGETS[iframeId];
            if (!meta) return null;
            const iframe = document.getElementById(iframeId);
            if (!iframe) return null;
            let doc;
            try { doc = iframe.contentDocument; } catch (e) { return null; }
            if (!doc) return null;

            const fields = {};
            collectFields(doc).forEach(el => {
                const k = getKeyOf(el);
                if (el.type === 'radio') {
                    if (el.checked) fields['@radio:' + (el.name || k)] = el.value;
                } else {
                    fields[k] = readValue(el);
                }
            });
            doc.querySelectorAll('.style-option.selected, .selected[data-style]').forEach(el => {
                if (el.dataset && el.dataset.style) fields['ui:selectedStyle'] = el.dataset.style;
            });
            const extras = collectExtraState(doc, iframeId);

            const snap = {
                id: hcGenId(),
                tool: iframeId,
                toolLabel: meta.label,
                title: customTitle || hcGuessTitle(iframeId, fields),
                preview: hcGuessPreview(iframeId, fields),
                createdAt: new Date().toISOString(),
                fields: fields,
                extras: extras
            };
            return snap;
        }

        function hcPushSnapshot(snap, opts = {}) {
            if (!snap) return false;
            const all = hcLoadAll();
            if (!all[snap.tool]) all[snap.tool] = [];
            all[snap.tool].unshift(snap); // mới nhất ở đầu
            if (all[snap.tool].length > HC_MAX_PER_TOOL) {
                all[snap.tool] = all[snap.tool].slice(0, HC_MAX_PER_TOOL);
            }
            hcSaveAll(all);
            // ghi nhớ phiên gần nhất
            try {
                localStorage.setItem(HC_LAST_KEY, JSON.stringify({ tool: snap.tool, id: snap.id, at: snap.createdAt }));
            } catch (e) {}
            hcRefreshStats();
            if (!opts.silent) showToast('📸 Đã lưu phiên: ' + snap.title.slice(0, 50));
            return true;
        }

        function hcCountTotal() {
            const all = hcLoadAll();
            return Object.values(all).reduce((s, arr) => s + (arr ? arr.length : 0), 0);
        }
        function hcRefreshStats() {
            const el = document.getElementById('hcStatsNum');
            if (el) el.textContent = hcCountTotal();
        }

        // Áp snapshot vào iframe — reload iframe và restore nhiều lần
        function hcApplySnapshot(snap) {
            if (!snap || !snap.tool) return;
            const iframeId = snap.tool;
            const meta = AUTOSAVE_TARGETS[iframeId];
            if (!meta) return;

            // Ghi snapshot vào key autosave để restoreFrame dùng
            const dataToSave = Object.assign({}, snap.fields || {}, { __extras: snap.extras || {}, __savedAt: snap.createdAt });
            try { localStorage.setItem(meta.key, JSON.stringify(dataToSave)); } catch (e) {}

            // Cập nhật phiên gần nhất
            try { localStorage.setItem(HC_LAST_KEY, JSON.stringify({ tool: snap.tool, id: snap.id, at: snap.createdAt })); } catch (e) {}

            // Chuyển tab và đóng modal
            activateTab(iframeId);
            hcClose();

            // Reload iframe để có DOM sạch, sau đó restore nhiều lần
            const iframe = document.getElementById(iframeId);
            if (iframe) {
                isRestoring[iframeId] = true; // chặn save đè ngay lập tức
                const src = iframe.getAttribute('srcdoc');
                iframe.removeAttribute('srcdoc');
                // một tick sau set lại để browser hiểu là reload
                setTimeout(() => {
                    iframe.setAttribute('srcdoc', src);
                    // attachAutosave sẽ tự chạy khi iframe load xong, nó đã có restore nhiều lần
                    // Thêm 1 vài lần restore nữa cho chắc
                    setTimeout(() => restoreFrame(iframeId, { silent: true }), 800);
                    setTimeout(() => restoreFrame(iframeId, { silent: true }), 2000);
                    setTimeout(() => restoreFrame(iframeId, { silent: true }), 3500);
                }, 30);
            }
            showToast('↩️ Đã khôi phục: ' + (snap.title || meta.label));
        }

        // Auto snapshot khi user save draft (hạn chế tần suất — 1 phiên / 60s / tool)
        const lastAutoSnap = {};
        function hcMaybeAutoSnapshot(iframeId) {
            const now = Date.now();
            if (lastAutoSnap[iframeId] && (now - lastAutoSnap[iframeId]) < 60000) return;
            const snap = hcSnapshot(iframeId);
            if (!snap) return;
            // chỉ push nếu có dữ liệu thực (tránh phiên trống)
            const meaningful = Object.values(snap.fields || {}).some(v => v && String(v).trim().length > 0);
            if (!meaningful) return;
            snap.title = '[Auto] ' + snap.title;
            hcPushSnapshot(snap, { silent: true });
            lastAutoSnap[iframeId] = now;
        }

        // Hook vào scheduleSave: mỗi lần save draft -> thử auto snapshot
        const _origScheduleSave = scheduleSave;
        scheduleSave = function(iframeId) {
            _origScheduleSave(iframeId);
            clearTimeout(window['__hc_t_' + iframeId]);
            window['__hc_t_' + iframeId] = setTimeout(() => hcMaybeAutoSnapshot(iframeId), 1500);
        };

        // -------- UI: mở modal, render danh sách --------
        const hcMask = document.getElementById('hcModalMask');
        const hcToolTabs = document.getElementById('hcToolTabs');
        const hcSessionList = document.getElementById('hcSessionList');
        let hcCurrentTool = null;

        function hcRenderTabs() {
            const all = hcLoadAll();
            const tools = Object.keys(AUTOSAVE_TARGETS);
            hcToolTabs.innerHTML = tools.map(id => {
                const cnt = (all[id] || []).length;
                const label = AUTOSAVE_TARGETS[id].label;
                const cls = (id === hcCurrentTool) ? 'hc-tool-tab active' : 'hc-tool-tab';
                return `<button class="${cls}" data-tool="${id}">${label}<span class="count">${cnt}</span></button>`;
            }).join('');
            hcToolTabs.querySelectorAll('.hc-tool-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    hcCurrentTool = btn.dataset.tool;
                    hcRenderTabs();
                    hcRenderList();
                });
            });
        }

        function hcEscape(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function hcFormatTime(iso) {
            try {
                const d = new Date(iso);
                const pad = (n) => String(n).padStart(2,'0');
                return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            } catch (e) { return iso; }
        }

        function hcRenderList() {
            const all = hcLoadAll();
            const list = all[hcCurrentTool] || [];
            const lastRaw = localStorage.getItem(HC_LAST_KEY);
            let lastId = null;
            try { lastId = JSON.parse(lastRaw || '{}').id; } catch(e) {}
            if (!list.length) {
                hcSessionList.innerHTML = `
                  <div class="hc-empty">
                    <div class="icon">📝</div>
                    <div>Chưa có phiên nào cho tool này</div>
                    <div style="margin-top:6px;font-size:12px">Bấm <b>📸 Lưu phiên hiện tại</b> trên thanh công cụ để tạo phiên ngay.</div>
                  </div>`;
                return;
            }
            hcSessionList.innerHTML = list.map(s => {
                const isLatest = (s.id === lastId);
                return `
                <div class="hc-session ${isLatest ? 'latest' : ''}" data-id="${s.id}">
                    <div>
                        <div class="title">
                            ${hcEscape(s.title)}
                            ${isLatest ? '<span class="badge-latest">Gần nhất</span>' : ''}
                        </div>
                        <div class="meta">🕒 ${hcFormatTime(s.createdAt)} · ${hcEscape(s.toolLabel)}</div>
                        ${s.preview ? `<div class="preview">${hcEscape(s.preview)}</div>` : ''}
                    </div>
                    <div class="actions">
                        <button class="restore" data-act="restore">↩️ Khôi phục</button>
                        <button class="rename" data-act="rename">✏️ Đổi tên</button>
                        <button class="del" data-act="del">🗑️</button>
                    </div>
                </div>`;
            }).join('');

            hcSessionList.querySelectorAll('.hc-session').forEach(card => {
                const id = card.dataset.id;
                card.querySelectorAll('button[data-act]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const act = btn.dataset.act;
                        const all2 = hcLoadAll();
                        const arr = all2[hcCurrentTool] || [];
                        const idx = arr.findIndex(x => x.id === id);
                        if (idx < 0) return;
                        if (act === 'restore') {
                            hcApplySnapshot(arr[idx]);
                            hcClose();
                        } else if (act === 'rename') {
                            const newName = prompt('Đổi tên phiên:', arr[idx].title || '');
                            if (newName != null) {
                                arr[idx].title = newName.trim() || arr[idx].title;
                                hcSaveAll(all2);
                                hcRenderList();
                                showToast('✏️ Đã đổi tên');
                            }
                        } else if (act === 'del') {
                            if (!confirm('Xoá phiên này?')) return;
                            arr.splice(idx, 1);
                            hcSaveAll(all2);
                            hcRenderTabs();
                            hcRenderList();
                            hcRefreshStats();
                            showToast('🗑️ Đã xoá phiên');
                        }
                    });
                });
            });
        }

        function hcOpen() {
            if (!hcCurrentTool) hcCurrentTool = currentTab && AUTOSAVE_TARGETS[currentTab] ? currentTab : Object.keys(AUTOSAVE_TARGETS)[0];
            hcRenderTabs();
            hcRenderList();
            hcMask.classList.add('show');
        }
        function hcClose() { hcMask.classList.remove('show'); }

        document.getElementById('hcOpenBtn').addEventListener('click', hcOpen);
        document.getElementById('hcCloseBtn').addEventListener('click', hcClose);
        hcMask.addEventListener('click', (e) => { if (e.target === hcMask) hcClose(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && hcMask.classList.contains('show')) hcClose();
        });

        // Nút Lưu phiên hiện tại
        document.getElementById('hcSaveSnapshotBtn').addEventListener('click', () => {
            if (!AUTOSAVE_TARGETS[currentTab]) {
                showToast('ℹ️ Tab này không hỗ trợ lưu phiên');
                return;
            }
            const customName = prompt('Đặt tên cho phiên này (để trống để dùng tên tự động):', '');
            if (customName === null) return; // cancel
            const snap = hcSnapshot(currentTab, customName.trim() || undefined);
            if (snap) hcPushSnapshot(snap);
        });

        // Nút Khôi phục phiên gần nhất
        document.getElementById('hcRestoreLastBtn').addEventListener('click', () => {
            let last;
            try { last = JSON.parse(localStorage.getItem(HC_LAST_KEY) || 'null'); } catch (e) {}
            if (!last || !last.tool || !last.id) {
                showToast('ℹ️ Chưa có phiên nào được lưu');
                return;
            }
            const all = hcLoadAll();
            const arr = all[last.tool] || [];
            const snap = arr.find(x => x.id === last.id) || arr[0];
            if (!snap) {
                showToast('ℹ️ Không tìm thấy phiên gần nhất');
                return;
            }
            hcApplySnapshot(snap);
        });

        // Init
        hcRefreshStats();

        // Tự động hỏi khôi phục phiên gần nhất sau khi trang tải xong
        window.addEventListener('load', () => {
            setTimeout(() => {
                let last;
                try { last = JSON.parse(localStorage.getItem(HC_LAST_KEY) || 'null'); } catch (e) {}
                if (!last || !last.tool) return;
                const all = hcLoadAll();
                const arr = all[last.tool] || [];
                const snap = arr.find(x => x.id === last.id) || arr[0];
                if (!snap) return;
                const minutesAgo = Math.round((Date.now() - new Date(snap.createdAt).getTime()) / 60000);
                if (minutesAgo > 60 * 24 * 7) return; // quá 1 tuần thì bỏ qua
                // Hiển thị prompt nổi nhẹ (không chặn)
                const banner = document.createElement('div');
                banner.style.cssText = 'position:fixed; left:50%; transform:translateX(-50%); top:14px; background:#1f2937; color:#fff; padding:10px 16px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:10001; font-size:13px; display:flex; gap:10px; align-items:center;';
                banner.innerHTML = `
                  <span>🕒 Có phiên gần nhất: <b>${hcEscape(snap.title)}</b> (${hcEscape(snap.toolLabel)})</span>
                  <button id="hcBannerRestore" style="background:linear-gradient(90deg,#ff6ec7,#a78bfa);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600">Khôi phục</button>
                  <button id="hcBannerDismiss" style="background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer">Bỏ qua</button>
                `;
                document.body.appendChild(banner);
                document.getElementById('hcBannerRestore').onclick = () => { hcApplySnapshot(snap); banner.remove(); };
                document.getElementById('hcBannerDismiss').onclick = () => banner.remove();
                setTimeout(() => { if (banner.parentNode) banner.remove(); }, 12000);
            }, 1800);
        });
    </script>
